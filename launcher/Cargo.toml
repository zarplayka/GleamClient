[package]
name = "gleam-launcher"
version = "0.1.49"
edition = "2021"
default-run = "gleam-launcher"

[features]
installer = ["dep:windows"]

[[bin]]
name = "gleam-installer"
path = "src/installer.rs"
required-features = ["installer"]

[dependencies]
tauri = "2.12.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
tempfile = "3"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"
flate2 = "1"

[build-dependencies]
serde_json = "1"
tauri-build = "2.7.4"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
dirs = "7"
windows = { version = "0.62.2", optional = true, features = ["Win32_System_Com", "Win32_UI_Shell"] }
