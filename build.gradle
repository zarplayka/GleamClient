plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${project.mod_version}-mc${minecraft_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Полноценный безопасный YAML-парсер для пословного формата Lyricsfile.
    implementation include('org.yaml:snakeyaml:2.5')
}

// Старый формат Redirect.at совместим с Loader 0.19.3 и новыми загрузчиками.
// Ограничиваем только компилятор: runtime Mixin по-прежнему выбирает Fabric Loader.
configurations.named('compileClasspath') {
    resolutionStrategy.force "net.fabricmc:sponge-mixin:${mixin_compile_version}"
}

def mediaHelpersResources = providers.gradleProperty('mediaHelpersDir')
        .map { rootProject.layout.projectDirectory.dir(it) }
        .orElse(rootProject.layout.buildDirectory.dir('generated/mediaResources'))

loom {
    runs {
        client { runDir "run/${minecraft_version}" }
    }
}

processResources {
    dependsOn rootProject.tasks.named('buildMediaHelpers')
    from(mediaHelpersResources)
    doFirst {
        ['OrionThumbnail.exe', 'OrionVolume.exe', 'SHA256SUMS'].each { name ->
            if (!mediaHelpersResources.get().file("assets/orion-client/media/${name}").asFile.isFile()) {
                throw new GradleException("Missing media helper ${name}; run native/media/build.ps1 first")
            }
        }
    }
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraft_version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version, "minecraft_version": minecraft_version
    }
}

processResources.doLast {
    def descriptor = destinationDir.toPath().resolve('orion-client.mixins.json').toFile()
    def mixins = new groovy.json.JsonSlurper().parse(descriptor)
    if (stonecutter.current.version == '26.2') {
        mixins.client.removeAll(['ClientClockInstanceMixin', 'EnchantGlintItemMixin', 'EnchantGlintShieldMixin'])
        mixins.client.addAll(['GleamLumenVertexMixin', 'GleamLegacyGlintMixin', 'GleamLegacySlotDropMixin'])
    }
    descriptor.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(mixins)) + '\n'
}

tasks.withType(AbstractArchiveTask).configureEach { archiveVersion = '' }

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from(rootProject.file("LICENSE")) {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
    from(rootProject.file('native/media')) {
        include '*.csproj', 'global.json', 'packages.lock.json', 'build.ps1', 'README.md'
        into 'META-INF/orion-media-source/native/media'
    }
    from(rootProject.file('LICENSE')) {
        into 'META-INF/orion-media-source'
    }
    from(rootProject.file('src/main/resources/assets/orion-client')) {
        include 'orion-thumbnail.cs', 'orion-volume.cs', 'gleam-beat.cs'
        into 'META-INF/orion-media-source/src/main/resources/assets/orion-client'
    }
}

tasks.register('writeRuntimeClasspath') {
    def output = layout.buildDirectory.file('runtime-classpath.txt')
    outputs.file(output)
    doLast { output.get().asFile.text = sourceSets.main.runtimeClasspath.asPath }
}
