<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Локальный макет меню паузы и откатов GleamClient">
  <title>GleamClient · Пауза</title>
  <link rel="icon" href="/src/main/resources/assets/orion-client/textures/cosmetics/orion_badge.png">
  <style>
    @font-face { font-family: Paradox; src: url("/src/main/resources/assets/orion-client/fonts/paradox/ParadoxSans-Regular.ttf"); font-weight: 400; font-display: swap }
    @font-face { font-family: Paradox; src: url("/src/main/resources/assets/orion-client/fonts/paradox/ParadoxSans-SemiBold.ttf"); font-weight: 600; font-display: swap }
    @font-face { font-family: Paradox; src: url("/src/main/resources/assets/orion-client/fonts/paradox/ParadoxSans-Bold.ttf"); font-weight: 700; font-display: swap }
    :root {
      color-scheme: dark;
      --ink: #f3f5fb;
      --muted: #aab3c3;
      --accent: #c2ccff;
      --accent-ink: #1c2450;
      --shell: #161a23;
      --line: #ffffff19;
      --surface: #ffffff08;
      --good: #8fe6b3;
      --danger: #f4a8aa;
      --edge: clamp(22px, 5vw, 88px);
      font: 14px Paradox, system-ui, sans-serif;
    }
    * { box-sizing: border-box }
    body { margin: 0; min-height: 100dvh; color: var(--ink); background: #101411 }
    [hidden] { display: none !important }
    .world, .shade { position: fixed; inset: 0; pointer-events: none }
    .world { background: url("../assets/gameplay-baseline.webp") center / cover no-repeat }
    .shade { background: #0c0f1c38; backdrop-filter: blur(4px) }
    button, select, input { font: inherit; color: inherit }
    button, select { cursor: pointer }
    button:disabled, select:disabled, input:disabled { cursor: default; opacity: .46 }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px }
    kbd {
      display: inline-grid; place-items: center; min-height: 24px; padding: 2px 6px;
      border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
      color: currentColor; font: 600 11px Paradox, sans-serif; white-space: nowrap;
    }
    .symbols { position: absolute; width: 0; height: 0 }
    .icon {
      width: 21px; height: 21px; flex: none; stroke: currentColor; fill: none;
      stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round;
    }
    .pause {
      --menu-row: 38px;
      --menu-gap: 10px;
      position: relative; display: grid; justify-items: center; align-items: center;
      min-height: 100dvh; padding: 14px 18px 64px;
    }
    .pause-content { position: relative; width: min(100%, 484px) }
    h1 { margin: 0 0 clamp(26px, 9.7vh, 52px); text-align: center; font-size: 26px; font-weight: 600; line-height: 1.15 }
    .menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--menu-gap) }
    .item, .utility {
      display: flex; justify-content: center; align-items: center; gap: 8px;
      min-width: 0; min-height: var(--menu-row); padding: 3px 8px;
      border: 1px solid #06071185; border-radius: 7px; color: #e2e3ed;
      background: #1b1a24; text-align: center; font-size: 13px; font-weight: 400;
      transition: background-color .15s, border-color .15s;
    }
    .item.wide { grid-column: 1 / -1 }
    .item:hover, .item[aria-expanded="true"], .utility:hover { border-color: #b7c1ff70; background: #292b3c }
    .item .icon { width: 14px; height: 14px; color: #a3a8ba }
    .utilities {
      position: absolute; top: calc(100% + clamp(17px, 10.1vh, 52px)); inset-inline: 0;
      display: flex; justify-content: center; gap: var(--menu-gap); align-items: center;
    }
    .utility-group { display: contents }
    .utility { flex: 0 0 var(--menu-row); width: var(--menu-row); padding: 0 }
    .utility .icon { width: 16px; height: 16px; color: #a3a8ba }
    .resume-preview {
      position: fixed; left: var(--edge); bottom: 30px; display: flex; gap: 9px; align-items: center;
      padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--shell);
    }

    .replay-screen {
      --screen-edge: clamp(14px, 2.2vw, 34px);
      position: fixed; inset: 0; margin: auto;
      width: min(1480px, max(910px, 74vw), calc(100% - 72px));
      height: min(max(550px, 75dvh), calc(100dvh - 60px));
      max-width: none; max-height: none; padding: 0; overflow: hidden;
      border: 1px solid #ffffff20; border-radius: 9px; color: var(--ink); background: #14151c;
      box-shadow: 0 24px 80px #04050a99; opacity: 0; transition: opacity .16s ease-out;
    }
    .replay-screen[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) }
    .replay-screen[data-visible] { opacity: 1 }
    .replay-screen::backdrop { background: #090a116b }
    .screen-header {
      display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch;
      min-height: 57px; gap: 12px; padding-inline: var(--screen-edge); border-bottom: 1px solid var(--line); background: #171820;
    }
    .screen-title { display: flex; align-items: center; gap: 9px }
    .screen-title .icon { width: 18px; height: 18px; color: var(--accent) }
    .screen-title h2 { margin: 0; font-size: 15px; line-height: 1.15; font-weight: 700 }
    .back, .tab, .filter, .favorite { border: 0; background: transparent }
    .back { display: inline-flex; gap: 7px; align-items: center; align-self: center; justify-self: end; padding: 5px 6px; border-radius: 5px; color: var(--muted); font-size: 12px }
    .back .icon { width: 15px; height: 15px }
    .back:hover, .tab:hover, .filter:hover, .favorite:hover { color: var(--ink); background: #ffffff0a }
    .tabs { display: flex; gap: 20px; align-items: stretch }
    .tab, .filter { min-height: 30px; color: var(--muted); font-size: 12px; font-weight: 600 }
    .tab { position: relative; padding-inline: 5px }
    .tab[aria-selected="true"] { color: var(--ink) }
    .tab[aria-selected="true"]::after { content: ""; position: absolute; inset: auto 5px 0; height: 2px; background: var(--accent) }
    .tab:focus-visible { outline-offset: -3px }
    .screen-body { overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: 15px var(--screen-edge) 30px }
    .library-tools { display: flex; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 10px }
    .filters { display: flex; gap: 12px }
    .filter { padding: 3px 8px; border-radius: 4px }
    .filter[aria-pressed="true"] { color: var(--ink); background: #ffffff12 }
    .library-actions { display: flex; gap: 14px; align-items: center }
    .clip-count { color: var(--muted); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums }
    .library-actions .save {
      display: grid; align-items: center; min-height: 29px; font-size: 11.5px; padding: 4px 8px;
      grid-template-columns: 14px minmax(0, 1fr) auto; gap: 6px;
      border: 1px solid #ffffff25; border-radius: 5px; background: #ffffff0b; color: var(--ink); font-weight: 600;
    }
    .library-actions .save:hover:enabled { background: #ffffff17 }
    .library-actions .save .icon { width: 14px; height: 14px; color: var(--accent) }
    .library-actions .save kbd { min-height: 18px; padding-inline: 4px; background: transparent; border-color: var(--line); color: var(--muted); font-size: 10px }
    .buffer-bar {
      display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap;
      min-height: 29px; margin-bottom: 13px; padding: 5px 10px;
      border-left: 2px solid #aebafa64; background: #a9b4ff12;
    }
    #buffer-note { margin: 0; color: var(--muted); font-size: 11px }
    .clip-layout { display: grid; grid-template-columns: minmax(220px, 28%) minmax(0, 1fr); gap: 20px; align-items: start }
    .clip-layout:not([data-selection]) { grid-template-columns: minmax(0, 1fr) }
    .clip-grid { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none }
    .clip-card { position: relative; min-width: 0 }
    .clip-open {
      display: grid; grid-template-columns: 90px minmax(0, 1fr); align-items: center; gap: 10px;
      width: 100%; min-height: 68px; padding: 7px 35px 7px 8px; text-align: left;
      border: 1px solid transparent; border-radius: 6px; background: transparent;
    }
    .clip-open:hover { background: #ffffff07 }
    .clip-open[aria-pressed="true"] { border-color: #b6c0ff38; background: #b6c0ff12 }
    .clip-open[aria-pressed="true"] .clip-name { color: #e6eaff }
    .clip-thumb { display: block; position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 4px; background: #202432 }
    .clip-thumb img, .clip-image { display: block; width: 100%; height: 100%; object-fit: cover }
    .clip-length { position: absolute; right: 3px; bottom: 3px; padding: 2px 4px; border-radius: 3px; background: #0b0d16e8; color: #fff; font: 600 10px Paradox, sans-serif; font-variant-numeric: tabular-nums }
    .clip-name, .clip-meta { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
    .clip-name { font-size: 13px; font-weight: 600 }
    .clip-meta { margin-top: 4px; color: var(--muted); font-size: 11px }
    .favorite { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); display: grid; place-items: center; width: 25px; height: 27px; border-radius: 4px; color: var(--muted) }
    .favorite:hover { background: #242a3d; color: var(--ink) }
    .favorite .icon { width: 15px; height: 15px }
    .favorite[aria-pressed="true"] .icon { fill: var(--accent); color: var(--accent) }
    .empty { display: grid; justify-items: center; text-align: center; gap: 9px; max-width: 340px; margin: clamp(34px, 10vh, 105px) auto 0 }
    .empty-icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: var(--surface); color: var(--muted) }
    .empty p { margin: 0; color: var(--muted); line-height: 1.5 }
    .clip-detail { position: sticky; top: 0; min-width: 0; padding-left: 20px; border-left: 1px solid var(--line) }
    .clip-preview { width: min(100%, 82dvh); margin: 0 auto }
    .clip-frame { position: relative; margin: 0; overflow: hidden; border-radius: 6px; border: 1px solid var(--line); background: #0b0d13 }
    .clip-frame .clip-length { right: 9px; bottom: 9px; padding: 4px 7px; font-size: 11px }
    .clip-image { aspect-ratio: 16 / 9; height: auto }
    .clip-caption { display: flex; align-items: start; justify-content: space-between; gap: 8px 18px; margin-top: 11px; flex-wrap: wrap }
    .clip-caption h3 { margin: 0 0 4px; font-size: 15px; overflow-wrap: anywhere }
    .clip-caption p { margin: 0; color: var(--muted); font-size: 11.5px }
    .clip-caption > small { color: var(--muted); font-size: 11px }
    @media (max-width: 820px) {
      .clip-layout { grid-template-columns: minmax(0, 1fr) }
      .clip-layout[data-preview-open] #clip-list { display: none }
      .clip-layout:not([data-preview-open]) .clip-detail { display: none }
      .clip-detail { position: static; padding: 0; border: 0 }
      .clip-open { grid-template-columns: 84px minmax(0, 1fr) }
    }
    .settings-panel { width: min(100%, 960px); margin: 5px auto 0 }
    .settings-panel h3 { margin: 0 0 13px; padding-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600 }
    .settings-columns { display: grid; align-items: start; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: clamp(20px, 5vw, 68px) }
    .settings-group { min-width: 0 }
    .settings-group .row + .row { border-top: 1px solid var(--line) }
    .estimate { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums }
    .buffer {
      display: grid; gap: 11px; padding: 13px 15px;
      border: 1px solid var(--line); border-radius: 5px; background: var(--surface);
    }
    .buffer-label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted) }
    .indicator { width: 7px; height: 7px; border-radius: 50%; background: #747e92 }
    .buffer-bar[data-state="ready"] .indicator { background: var(--good) }
    .buffer-bar[data-state="buffering"] .indicator { background: var(--accent) }
    .buffer-time { color: var(--ink); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap }
    .buffer-time small { color: var(--muted); font-size: inherit; font-weight: 400 }
    .buffer progress {
      width: 100%; height: 5px; overflow: hidden; border: 0; border-radius: 4px;
      appearance: none; background: #272d3d; color: var(--accent);
    }
    .buffer progress::-webkit-progress-bar { background: #272d3d }
    .buffer progress::-webkit-progress-value { background: var(--accent); border-radius: 4px }
    .buffer progress::-moz-progress-bar { background: var(--accent); border-radius: 4px }
    .note { margin: 8px 2px 0; font-size: 11.5px; line-height: 1.45; color: var(--muted) }
    .options { margin-top: 12px }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 40px }
    .row > label, .row > span { font-size: 13px; font-weight: 600 }
    .select-wrap { position: relative; flex: none }
    .select-wrap > .icon {
      position: absolute; top: 50%; right: 9px; transform: translateY(-50%);
      width: 12px; height: 12px; color: var(--muted); pointer-events: none;
    }
    select, .rate-input {
      appearance: none; min-height: 31px; border: 1px solid var(--line); border-radius: 5px;
      background: #20222d; padding: 4px 26px 4px 9px; font-size: 12px;
    }
    select { min-width: 126px; max-width: 180px }
    .rate-input { width: 62px; padding-right: 5px; font-variant-numeric: tabular-nums }
    .control-group { display: flex; gap: 6px; align-items: center }
    .control-group select { min-width: 74px; max-width: 125px }
    .switch {
      position: relative; flex: none; appearance: none; display: block; width: 35px; height: 20px;
      border: 1px solid #ffffff34; border-radius: 999px;
      margin: 0; background: #2b3140; cursor: pointer; transition: background-color .16s;
    }
    .switch::after {
      content: ""; position: absolute; left: 3px; top: 3px; width: 12px; height: 12px;
      border-radius: 50%; background: #b6bece; transition: transform .16s;
    }
    .switch:checked { background: var(--accent); border-color: var(--accent) }
    .switch:checked::after { transform: translateX(15px); background: var(--accent-ink) }
    .toast {
      position: fixed; z-index: 1; right: var(--edge); bottom: 31px; max-width: min(390px, calc(100vw - 40px));
      margin: 0; padding: 11px 15px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--shell); color: var(--ink); box-shadow: 0 12px 30px #080a1070;
    }
    .replay-status { position: absolute; color: var(--good); right: var(--screen-edge); bottom: 20px; pointer-events: none }
    .replay-status:empty { display: none }
    @media (max-width: 620px) {
      .replay-screen { width: calc(100% - 30px); height: calc(100dvh - 32px) }
      .screen-header { min-height: 51px; gap: 8px }
      .screen-title { gap: 6px }
      .screen-title .icon { width: 16px; height: 16px }
      .back .label { display: none }
      .tabs, .filters { gap: 5px }
      .tab, .filter { padding-inline: 6px }
      .settings-columns { grid-template-columns: minmax(0, 1fr); gap: 24px }
      .library-tools { align-items: stretch; flex-wrap: wrap; gap: 7px }
      .library-actions { flex-wrap: wrap; justify-content: flex-end; gap: 7px; max-width: 100%; margin-left: auto }
      .buffer-bar { gap: 2px 8px }
    }
    @media (max-width: 379px) {
      .pause { --menu-gap: 7px; --menu-row: 34px; padding-inline: 13px }
      .screen-header { grid-template-columns: minmax(0, 1fr) auto }
      .screen-header .tabs { grid-column: 1 / -1; grid-row: 2; justify-self: center }
      .back { grid-column: 2; grid-row: 1 }
      .screen-title .icon, .back kbd { display: none }
      .row { gap: 7px }
      .row > label { font-size: 12px }
      select { min-width: 100px }
    }
    @media (max-height: 430px) {
      .pause { --menu-row: 34px; --menu-gap: 7px; padding-bottom: 85px }
      h1 { margin-bottom: 22px }
      .utilities { top: calc(100% + 15px) }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important } }
  </style>
</head>

  <div class="world" aria-hidden="true"></div>
  <div class="shade" id="shade" aria-hidden="true"></div>
  <main class="pause" id="pause" aria-labelledby="pause-title">
    <div class="pause-content">
      <h1 id="pause-title">Меню</h1>
      <nav class="menu" aria-label="Меню паузы">
        <button class="item wide" id="resume" type="button">Вернуться к игре</button>
        <button class="item" type="button" data-preview="В игре откроются достижения">Достижения</button>
        <button class="item" type="button" data-preview="В игре откроется статистика">Статистика</button>
        <button class="item" type="button" data-preview="В игре откроются настройки Minecraft">Настройки</button>
        <button class="item" type="button" data-preview="В игре откроется кейбинд менеджер">Кейбинд менеджер</button>
        <button class="item wide" id="open-replay" type="button" aria-controls="replay" aria-haspopup="dialog" aria-expanded="false">Откаты</button>
        <button class="item wide" id="exit" type="button" data-preview="В игре эта кнопка выходит из мира"><svg class="icon" aria-hidden="true"><use href="#i-exit"/></svg><span>Сохранить и выйти</span></button>
      </nav>
      <nav class="utilities" aria-label="Дополнительные действия">
        <div class="utility-group" id="utility-left"></div>
        <button class="utility" type="button" title="Язык" aria-label="Язык" data-preview="В игре откроется выбор языка"><svg class="icon" aria-hidden="true"><use href="#i-language"/></svg></button>
        <div class="utility-group" id="utility-right"></div>
      </nav>
    </div>
  </main>
  <button class="resume-preview" id="show-pause" type="button" hidden><kbd>Esc</kbd> Открыть паузу</button>

  <dialog class="replay-screen" id="replay" aria-labelledby="replay-title">
    <header class="screen-header">
      <div class="screen-title"><svg class="icon" aria-hidden="true"><use href="#i-replay"/></svg><h2 id="replay-title">Откаты</h2></div>
      <div class="tabs" role="tablist" aria-label="Разделы откатов">
        <button class="tab" id="tab-clips" type="button" role="tab" aria-selected="true" aria-controls="replay-library">Клипы</button>
        <button class="tab" id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="replay-settings" tabindex="-1">Настройки</button>
      </div>
      <button class="back" id="close-replay" type="button" aria-label="Назад" autofocus><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg><span class="label">Назад</span><kbd>Esc</kbd></button>
    </header>
    <div class="screen-body" id="replay-body">
      <section id="replay-library" role="tabpanel" aria-labelledby="tab-clips">
        <div>
          <div class="library-tools">
            <div class="filters" role="group" aria-label="Фильтр клипов">
              <button class="filter" id="filter-all" type="button" aria-pressed="true">Все клипы</button>
              <button class="filter" id="filter-favorites" type="button" aria-pressed="false">Избранное</button>
            </div>
            <div class="library-actions">
              <span class="clip-count" id="clip-count"></span>
              <button class="save" id="save" type="button"><svg class="icon" aria-hidden="true"><use href="#i-save"/></svg><span id="save-label"></span><kbd>Alt + F10</kbd></button>
            </div>
          </div>
          <div class="buffer-bar" id="buffer">
            <span class="buffer-label"><span class="indicator" aria-hidden="true"></span><span id="buffer-label"></span></span>
            <p class="note" id="buffer-note"></p>
          </div>
          <div class="clip-layout" id="clip-layout">
            <div id="clip-list">
              <ul class="clip-grid" id="clip-grid" aria-label="Список клипов"></ul>
              <div class="empty" id="clip-empty" hidden>
                <span class="empty-icon"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg></span>
                <strong>Пока нет избранных клипов</strong>
                <p>Нажми на звезду рядом с клипом, чтобы он появился здесь.</p>
              </div>
            </div>
            <section class="clip-detail" id="clip-detail" aria-labelledby="clip-detail-title" hidden>
              <div class="clip-preview">
                <figure class="clip-frame">
                  <img class="clip-image" id="clip-detail-image" alt="Кадр из Minecraft">
                  <span class="clip-length" id="clip-detail-length"></span>
                </figure>
                <div class="clip-caption">
                  <div><h3 id="clip-detail-title" tabindex="-1"></h3><p id="clip-detail-meta"></p></div>
                  <small>Предпросмотр кадра</small>
                </div>
              </div>
            </section>
          </div>
        </div>
      </section>
      <section class="settings-panel" id="replay-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
        <div class="settings-columns">
          <section class="settings-group" aria-labelledby="buffer-title">
            <h3 id="buffer-title">Буфер откатов</h3>
            <div class="buffer">
              <span class="buffer-time"><span id="buffer-time"></span><small id="buffer-total"></small></span>
              <progress id="buffer-progress" aria-label="Заполнение буфера"></progress>
            </div>
            <div class="row"><label for="enabled">Буфер откатов</label><input class="switch" id="enabled" type="checkbox" role="switch" checked></div>
            <div class="row"><label for="duration">Длительность</label><span class="select-wrap"><select id="duration"><option value="30">30 секунд</option><option value="60" selected>60 секунд</option><option value="120">120 секунд</option></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></span></div>
          </section>
          <section class="settings-group" aria-labelledby="settings-title">
            <h3 id="settings-title">Запись</h3>
            <div class="row"><label for="audio">Источник звука</label><span class="select-wrap"><select id="audio"><option value="game">Minecraft</option><option value="system">Вся система</option></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></span></div>
            <div class="row"><label for="mic">Микрофон</label><input class="switch" id="mic" type="checkbox" role="switch"></div>
            <div class="row"><label for="resolution">Разрешение</label><span class="select-wrap"><select id="resolution"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="1440">1440p</option><option value="source">Исходное</option></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></span></div>
            <div class="row"><label for="fps">FPS записи</label><span class="select-wrap"><select id="fps"><option value="30">30 FPS</option><option value="60" selected>60 FPS</option></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></span></div>
            <div class="row"><label for="quality">Качество</label><span class="select-wrap"><select id="quality"><option value="performance">Производительность</option><option value="balanced" selected>Баланс</option><option value="quality">Качество</option></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></span></div>
            <div class="row"><label for="bitrate-mode">Битрейт</label><div class="control-group"><span class="select-wrap"><select id="bitrate-mode"><option value="auto">Авто</option><option value="manual">Вручную</option></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></span><input class="rate-input" id="bitrate" type="number" min="2" max="60" value="16" aria-label="Битрейт в Мбит/с" hidden></div></div>
            <p class="estimate" id="estimate"></p>
          </section>
        </div>
      </section>
    </div>
    <p class="toast replay-status" id="replay-status" role="status"></p>
  </dialog>
  <template id="clip-template">
    <li class="clip-card">
      <button class="clip-open" type="button">
        <span class="clip-thumb"><img alt=""><span class="clip-length"></span></span>
        <span><strong class="clip-name"></strong><small class="clip-meta"></small></span>
      </button>
      <button class="favorite" type="button"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg></button>
    </li>
  </template>
  <p class="toast" id="toast" role="status" hidden></p>

  <script>
    (() => {
      const byId = id => document.getElementById(id);
      const query = new URLSearchParams(location.search);
      const pause = byId('pause');
      const screen = byId('replay');
      const opener = byId('open-replay');
      const enabled = byId('enabled');
      const duration = byId('duration');
      const save = byId('save');
      const bitrateMode = byId('bitrate-mode');
      const bitrate = byId('bitrate');
      const motion = matchMedia('(prefers-reduced-motion: reduce)');
      const library = byId('replay-library');
      const settings = byId('replay-settings');
      const layout = byId('clip-layout');
      const compact = matchMedia('(max-width: 820px)');
      const detail = byId('clip-detail');
      const filters = [byId('filter-all'), byId('filter-favorites')];
      const tabButtons = [byId('tab-clips'), byId('tab-settings')];
      const plurals = new Intl.PluralRules('ru');
      const date = new Intl.DateTimeFormat('ru-RU', {dateStyle: 'medium', timeStyle: 'short'});
      const clipImage = '../assets/gameplay-orion.webp';
      const clips = [{title: 'Откат из мира', at: new Date('2026-11-25T18:24:00'), seconds: 24, format: '1080p · 60 FPS', favorite: false}];
      let favoritesOnly = false;
      let clipFocus, selectedClip;
      const recording = ['resolution', 'fps', 'quality', 'bitrate-mode', 'bitrate'];
      const rateBase = {720: 9, 1080: 16, 1440: 25, source: 16};
      const rateFactors = {performance: .75, balanced: 1, quality: 1.25};
      let available = query.get('state') === 'buffering' ? 24 : 60;
      let playingSince = null;
      let previewTimer, replayTimer;
      let savePending = false;
      let closingTimer;
      let settingBitrate = null;
      const version = /^(\d+)(?:\.(\d+))?/.exec(query.get('version') || '26.3');
      const major = Number(version?.[1]);
      const minor = major > 26 ? Infinity : Number(version?.[2] ?? 3);
      const multiplayer = query.get('world') === 'multi';

      if (multiplayer) {
        byId('exit').querySelector('span').textContent = 'Отключиться';
        byId('exit').dataset.preview = 'В игре эта кнопка отключает от сервера';
      }
      if (major >= 26) {
        const left = byId('utility-left');
        const right = byId('utility-right');
        if (multiplayer && query.get('links') === '1') addUtility(left, 'links', 'Ссылки сервера');
        if (minor >= 3 || !multiplayer) {
          const label = minor >= 3 ? 'Настройки мира' : minor >= 2 ? 'Настройки сетевой игры' : 'Открыть для сети';
          addUtility(left, 'world', label);
        }
        if (minor >= 2) addUtility(left, 'friends', 'Друзья');
        addUtility(right, 'feedback', 'Обратная связь');
        addUtility(right, 'bug', 'Сообщить об ошибке');
        addUtility(right, minor >= 4 ? 'players' : 'report', minor >= 4 ? 'Другие игроки' : 'Жалоба на игрока', !multiplayer);
      }
      enabled.checked = query.get('state') !== 'off';
      if (!enabled.checked) available = 0;

      function addUtility(group, icon, label, disabled = false) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'utility';
        button.title = disabled ? label + ' · доступно в сетевой игре' : label;
        button.setAttribute('aria-label', label);
        button.dataset.preview = label + ' · действие в Minecraft';
        button.disabled = disabled;
        button.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-' + icon + '"/></svg>';
        group.append(button);
      }
      function length() { return Number(duration.value); }
      function seconds() {
        const playing = playingSince === null ? 0 : (performance.now() - playingSince) / 1000;
        return enabled.checked ? Math.min(length(), Math.floor(available + playing)) : 0;
      }
      function time(sec) {
        return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
      }
      function rate() {
        if (bitrateMode.value === 'manual') {
          return Math.max(2, Math.min(60, Number(bitrate.value) || 16));
        }
        const profile = rateFactors[byId('quality').value];
        const frameRate = byId('fps').value === '60' ? 1 : .65;
        return Math.round(rateBase[byId('resolution').value] * profile * frameRate);
      }
      function render() {
        const target = length();
        const buffered = seconds();
        const ready = buffered === target;
        byId('buffer').dataset.state = ready ? 'ready' : enabled.checked ? 'buffering' : 'off';
        const label = ready ? 'Буфер готов' : enabled.checked ? 'Буфер заполняется' : 'Буфер выключен';
        byId('buffer-label').textContent = enabled.checked ? label + ' · ' + time(buffered) + ' / ' + time(target) : label;
        byId('buffer-time').textContent = time(buffered);
        byId('buffer-total').textContent = ' / ' + time(target);
        byId('buffer-progress').max = target;
        byId('buffer-progress').value = buffered;
        byId('save-label').textContent = savePending ? 'Сохраняем клип…'
          : buffered ? 'Сохранить последние ' + buffered + ' с' : 'Сохранить откат';
        save.disabled = savePending || buffered < 1;
        byId('buffer-note').textContent = !enabled.checked ? 'Включи буфер, чтобы сохранять моменты из игры.'
          : buffered === 0 ? 'Буфер заполнится, когда вернёшься в игру.'
          : 'При сохранении из паузы клип закончится на открытии меню.';
        bitrate.hidden = bitrateMode.value !== 'manual';
        if (bitrate.hidden) bitrate.value = rate();
        const source = byId('resolution').value;
        const resolution = source === 'source' ? 'Исходное' : source + 'p';
        byId('estimate').textContent = resolution + ' · ' + byId('fps').value + ' FPS · ' + rate() + ' Мбит/с';
      }
      function showSelection() {
        detail.hidden = !selectedClip;
        layout.toggleAttribute('data-selection', Boolean(selectedClip));
        if (!selectedClip) {
          returnToClips();
          return;
        }
        byId('clip-detail-title').textContent = selectedClip.title;
        byId('clip-detail-meta').textContent = date.format(selectedClip.at) + ' · ' + selectedClip.format;
        byId('clip-detail-image').src = clipImage;
        byId('clip-detail-length').textContent = time(selectedClip.seconds);
      }
      function renderClips() {
        const grid = byId('clip-grid');
        const visible = favoritesOnly ? clips.filter(clip => clip.favorite) : clips;
        const noun = {one: 'клип', few: 'клипа', many: 'клипов'}[plurals.select(visible.length)];
        byId('clip-count').textContent = visible.length + ' ' + noun;
        byId('clip-empty').hidden = visible.length > 0;
        if (!visible.includes(selectedClip)) selectedClip = visible[0];
        showSelection();
        grid.replaceChildren(...visible.map(clip => {
          const card = byId('clip-template').content.firstElementChild.cloneNode(true);
          const open = card.querySelector('.clip-open');
          const star = card.querySelector('.favorite');
          open.setAttribute('aria-pressed', String(clip === selectedClip));
          card.querySelector('img').src = clipImage;
          card.querySelector('.clip-length').textContent = time(clip.seconds);
          card.querySelector('.clip-name').textContent = clip.title;
          card.querySelector('.clip-meta').textContent = clip.format;
          function describeFavorite() {
            star.setAttribute('aria-pressed', String(clip.favorite));
            star.title = clip.favorite ? 'Убрать из избранного' : 'В избранное';
            star.setAttribute('aria-label', star.title + ' · ' + clip.title);
          }
          describeFavorite();
          star.addEventListener('click', () => {
            clip.favorite = !clip.favorite;
            if (favoritesOnly && !clip.favorite) { renderClips(); filters[1].focus(); }
            else describeFavorite();
          });
          open.addEventListener('click', () => {
            selectedClip = clip;
            grid.querySelector('[aria-pressed="true"].clip-open')?.setAttribute('aria-pressed', 'false');
            open.setAttribute('aria-pressed', 'true');
            showSelection();
            if (!compact.matches) return;
            clipFocus = open;
            layout.setAttribute('data-preview-open', '');
            byId('replay-body').scrollTop = 0;
            byId('clip-detail-title').focus();
          });
          return card;
        }));
      }
      function returnToClips(restoreFocus = false) {
        layout.removeAttribute('data-preview-open');
        if (restoreFocus) (clipFocus?.isConnected ? clipFocus : filters[Number(favoritesOnly)]).focus();
        clipFocus = null;
      }
      function selectTab(index, focus = false) {
        returnToClips();
        tabButtons.forEach((tab, position) => {
          tab.setAttribute('aria-selected', String(position === index));
          tab.tabIndex = position === index ? 0 : -1;
        });
        library.hidden = index !== 0;
        settings.hidden = index !== 1;
        byId('replay-body').scrollTop = 0;
        if (focus) tabButtons[index].focus();
      }
      function replayMessage(message = '') {
        clearTimeout(replayTimer);
        byId('replay-status').textContent = message;
        if (message) replayTimer = setTimeout(() => replayMessage(), 2500);
      }
      function toast(message) {
        if (screen.open) {
          replayMessage(message);
          return;
        }
        const element = byId('toast');
        clearTimeout(previewTimer);
        element.textContent = message;
        element.hidden = false;
        previewTimer = setTimeout(() => { element.hidden = true; }, 2500);
      }
      function openReplays(tab = 0) {
        clearTimeout(closingTimer);
        if (!screen.open) { selectTab(tab); screen.showModal(); }
        opener.setAttribute('aria-expanded', 'true');
        if (motion.matches) screen.dataset.visible = '';
        else requestAnimationFrame(() => requestAnimationFrame(() => {
          if (screen.open && opener.getAttribute('aria-expanded') === 'true') screen.dataset.visible = '';
        }));
      }
      function closeReplays() {
        if (!screen.open || opener.getAttribute('aria-expanded') === 'false') return;
        delete screen.dataset.visible;
        opener.setAttribute('aria-expanded', 'false');
        const finish = () => {
          screen.close();
          returnToClips();
          replayMessage();
          opener.focus();
        };
        if (motion.matches) finish();
        else closingTimer = setTimeout(finish, 175);
      }
      function resume() {
        playingSince = performance.now();
        pause.hidden = true;
        byId('shade').hidden = true;
        byId('show-pause').hidden = false;
        byId('show-pause').focus();
      }
      function showPause() {
        available = seconds();
        playingSince = null;
        pause.hidden = false;
        byId('shade').hidden = false;
        byId('show-pause').hidden = true;
        render();
        byId('resume').focus();
      }
      function saveClip() {
        const buffered = seconds();
        if (savePending || buffered < 1) {
          if (!screen.open && buffered < 1) toast(enabled.checked ? 'Буфер пока пуст' : 'Буфер откатов выключен');
          return;
        }
        const source = byId('resolution').value;
        const format = (source === 'source' ? 'Исходное' : source + 'p') + ' · ' + byId('fps').value + ' FPS';
        const savedAt = new Date();
        savePending = true;
        replayMessage();
        render();
        setTimeout(() => {
          savePending = false;
          clips.unshift({title: 'Откат ' + (clips.length + 1), at: savedAt, seconds: buffered, format, favorite: false});
          renderClips();
          render();
          toast('Клип сохранён · ' + buffered + ' с');
        }, 330);
      }

      function back() {
        if (!library.hidden && compact.matches && layout.hasAttribute('data-preview-open')) returnToClips(true);
        else closeReplays();
      }
      compact.addEventListener('change', () => returnToClips());
      opener.addEventListener('click', () => openReplays());
      byId('close-replay').addEventListener('click', back);
      screen.addEventListener('cancel', event => { event.preventDefault(); back(); });
      screen.addEventListener('click', event => {
        if (event.target !== screen) return;
        const bounds = screen.getBoundingClientRect();
        if (event.clientX < bounds.left || event.clientX > bounds.right ||
            event.clientY < bounds.top || event.clientY > bounds.bottom) closeReplays();
      });
      filters.forEach((filter, index) => filter.addEventListener('click', () => {
        favoritesOnly = index === 1;
        filters.forEach((button, position) => button.setAttribute('aria-pressed', String(position === index)));
        renderClips();
      }));
      tabButtons.forEach((tab, index) => {
        tab.addEventListener('click', () => selectTab(index, true));
        tab.addEventListener('keydown', event => {
          if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
          event.preventDefault();
          selectTab(event.key === 'Home' ? 0 : event.key === 'End' ? 1 : 1 - index, true);
        });
      });
      byId('resume').addEventListener('click', resume);
      byId('show-pause').addEventListener('click', showPause);
      save.addEventListener('click', saveClip);
      enabled.addEventListener('change', () => { available = 0; render(); });
      duration.addEventListener('change', () => { available = Math.min(available, length()); render(); });
      for (const id of recording) byId(id).addEventListener('change', () => {
        const value = rate();
        if (id !== 'bitrate-mode' || value !== settingBitrate) available = 0;
        settingBitrate = value;
        if (id === 'bitrate') bitrate.value = value;
        render();
      });
      for (const button of pause.querySelectorAll('[data-preview]')) {
        button.addEventListener('click', () => toast(button.dataset.preview));
      }
      document.addEventListener('keydown', event => {
        if (event.altKey && event.code === 'F10') {
          event.preventDefault();
          if (!event.repeat) saveClip();
          return;
        }
        if (screen.open) return;
        if (event.key === 'Escape') {
          event.preventDefault();
          if (pause.hidden) showPause(); else resume();
          return;
        }
        if (pause.hidden || !['ArrowUp', 'ArrowDown'].includes(event.key)) return;
        event.preventDefault();
        const items = [...pause.querySelectorAll('.item, .utility:enabled')];
        const index = items.indexOf(document.activeElement);
        const step = event.key === 'ArrowDown' ? 1 : -1;
        items[index < 0 ? 0 : (index + step + items.length) % items.length].focus();
      });
      settingBitrate = rate();
      render();
      renderClips();
      if (query.get('panel') === 'replays') openReplays(query.get('tab') === 'settings' ? 1 : 0);
    })();
  </script>
</body>
</html>
