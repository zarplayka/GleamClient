<!doctype html>
<html lang="ru">
<head>

  <title>GleamClient · Пауза</title>
  <link rel="icon" href="/src/main/resources/assets/orion-client/textures/cosmetics/orion_badge.png">
  <style>
    @font-face { font-family: Paradox; src: url("/src/main/resources/assets/orion-client/fonts/paradox/ParadoxSans-Regular.ttf"); font-weight: 400; font-display: swap }
    @font-face { font-family: Paradox; src: url("/src/main/resources/assets/orion-client/fonts/paradox/ParadoxSans-SemiBold.ttf"); font-weight: 600; font-display: swap }
    @font-face { font-family: Paradox; src: url("/src/main/resources/assets/orion-client/fonts/paradox/ParadoxSans-Bold.ttf"); font-weight: 700; font-display: swap }
    :root {

      --ink: #f3f5fb;

      --accent: #c2ccff;

      --line: #ffffff19;
      --surface: #ffffff08;

    * { box-sizing: border-box }
    body { margin: 0; min-height: 100dvh; color: var(--ink); background: #101411 }

    .world, .shade { position: fixed; inset: 0; pointer-events: none }
    .world { background: url("../assets/gameplay-baseline.webp") center / cover no-repeat }
    .shade { background: #0c0f1c38; backdrop-filter: blur(4px) }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px }
    kbd {
      display: inline-grid; place-items: center; min-height: 24px; padding: 2px 6px;
      border: 1px solid var(--line); border-radius: 6px; background: var(--surface);

    .symbols { position: absolute; width: 0; height: 0 }

    .pause-content { position: relative; width: min(100%, 484px) }

    .item, .utility {

      min-width: 0; min-height: var(--menu-row); padding: 3px 8px;

      background: #1b1a24; text-align: center; font-size: 13px; font-weight: 400;

    .utilities {
      position: absolute; top: calc(100% + clamp(17px, 10.1vh, 52px)); inset-inline: 0;
      display: flex; justify-content: center; gap: var(--menu-gap); align-items: center;
    }
    .utility-group { display: contents }
    .utility { flex: 0 0 var(--menu-row); width: var(--menu-row); padding: 0 }
    .utility .icon { width: 16px; height: 16px; color: #a3a8ba }
    .resume-preview {
      position: fixed; left: var(--edge); bottom: 30px; display: flex; gap: 9px; align-items: center;
      padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--shell);
    }

    .replay-screen {
      --screen-edge: clamp(14px, 2.2vw, 34px);
      position: fixed; inset: 0; margin: auto;
      width: min(1480px, max(910px, 74vw), calc(100% - 72px));
      height: min(max(550px, 75dvh), calc(100dvh - 60px));
      max-width: none; max-height: none; padding: 0; overflow: hidden;
      border: 1px solid #ffffff20; border-radius: 9px; color: var(--ink); background: #14151c;
      box-shadow: 0 24px 80px #04050a99; opacity: 0; transform: translateY(12px) scale(.978);

    .replay-screen[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) }
    .replay-screen[data-visible] { opacity: 1; transform: none }
    .replay-screen::backdrop { background: #090a116b; opacity: 0; transition: opacity .22s ease-out }
    .replay-screen[data-visible]::backdrop { opacity: 1 }
    .screen-header {
      display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch;
      min-height: 57px; gap: 12px; padding-inline: var(--screen-edge); border-bottom: 1px solid var(--line); background: #171820;

    .screen-title { display: flex; align-items: center; gap: 9px }

    .back, .tab, .filter, .favorite { border: 0; background: transparent }
    .back { display: inline-flex; gap: 7px; align-items: center; align-self: center; justify-self: end; padding: 5px 6px; border-radius: 5px; color: var(--muted); font-size: 12px }
    .back .icon { width: 15px; height: 15px }
    .back:hover, .tab:hover, .filter:hover, .favorite:hover { color: var(--ink); background: #ffffff0a }
    .tabs { display: flex; gap: 20px; align-items: stretch }
    .tab, .filter { min-height: 30px; color: var(--muted); font-size: 12px; font-weight: 600 }
    .tab { position: relative; padding-inline: 5px }
    .tab[aria-selected="true"] { color: var(--ink) }
    .tab[aria-selected="true"]::after { content: ""; position: absolute; inset: auto 5px 0; height: 2px; background: var(--accent) }
    .tab:focus-visible { outline-offset: -3px }
    .screen-body { overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: 15px var(--screen-edge) 30px }
    .library-tools { display: flex; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 10px }
    .filters { display: flex; gap: 12px }
    .filter { padding: 3px 8px; border-radius: 4px }
    .filter[aria-pressed="true"] { color: var(--ink); background: #ffffff12 }
    .title-menu {
      display: grid; align-content: center; justify-items: center; gap: 24px;
      min-height: 100dvh; padding: 20px; position: relative; --menu-row: 42px; --menu-gap: 6px;
    }
    body[data-view="title"] .world { background-image: url("launcher-background-26-3.webp") }
    body[data-view="title"] .shade { background: #0c0f1c57; backdrop-filter: none }
    .title-brand { display: flex; align-items: center; gap: 13px; font-size: clamp(29px, 5vw, 42px); font-weight: 700; text-shadow: 0 2px 6px #101016 }
    .title-brand img { width: 41px; height: 41px; object-fit: contain }
    .title-menu nav { display: grid; gap: 7px; width: min(100%, 300px) }
    .title-menu .item { font-size: 13px }
    .title-menu .item:first-child { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700 }
    .title-menu .item:first-child:hover { background: #d7ddff }
    .screen-tools { display: flex; justify-content: flex-end; align-items: center; gap: 10px; min-width: 0 }
    .capture-toggle { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); white-space: nowrap }
    .screen-tools .back { border-left: 1px solid var(--line); padding-left: 9px }
    .clip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 212px), 1fr)); gap: 18px 14px; margin: 0; padding: 0; list-style: none }
    .clip-card { position: relative; min-width: 0; max-width: 295px }
    .clip-open { display: block; width: 100%; padding: 0; border: 0; border-radius: 5px; background: transparent; text-align: left }
    .clip-open:hover .clip-thumb { border-color: #b6c0ff7a }
    .clip-thumb { display: block; position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid var(--line); border-radius: 5px; background: #202432 }
    .clip-thumb img, .edit-frame img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover }
    .clip-length { position: absolute; right: 6px; bottom: 6px; padding: 3px 5px; border-radius: 4px; background: #0b0d16e8; color: #fff; font: 600 11px Paradox, sans-serif; font-variant-numeric: tabular-nums }
    .clip-name, .clip-meta { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
    .clip-name { margin-top: 6px; font-size: 13px; font-weight: 600 }
    .clip-meta { margin-top: 3px; color: var(--muted); font-size: 11px }
    .favorite { position: absolute; top: 6px; right: 6px; display: grid; place-items: center; width: 27px; height: 27px; border-radius: 4px; color: var(--ink); background: #0c0e18e6 }
    .favorite:hover { background: #242a3d }
    .favorite .icon { width: 15px; height: 15px }
    .favorite[aria-pressed="true"] .icon { fill: var(--accent); color: var(--accent) }
    .edit-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px }
    .edit-header h3 { margin: 0; font-size: 13px; font-weight: 600; overflow-wrap: anywhere }
    .edit-back, .plain-action, .key-button {
      border: 1px solid var(--line); border-radius: 5px; background: var(--surface);
      color: var(--ink); font-size: 12px; padding: 5px 8px; min-height: 29px;
    }
    .edit-back:hover, .plain-action:hover, .key-button:hover { background: #ffffff12 }
    .edit-back {
      display: inline-flex; gap: 6px; align-items: center; white-space: nowrap;
      border-color: transparent; background: transparent; color: var(--muted); padding-inline: 5px; font-size: 11.5px;
    }
    .edit-back .icon { width: 13px; height: 13px }
    .edit-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(215px, 24%); gap: 17px; align-items: start }
    .edit-player { min-width: 0 }
    .edit-frame { position: relative; margin: 0; overflow: hidden; border-radius: 5px; border: 1px solid var(--line); background: #0b0d13 }
    .edit-frame img { object-fit: contain }
    .edit-frame figcaption { position: absolute; right: 8px; bottom: 8px; color: #fff; background: #0b0d16df; border-radius: 3px; padding: 3px 6px; font-size: 10px }
    .timeline { margin-top: 8px }
    .timeline-track { position: relative; height: 23px; --thumb: 12px }
    .timeline-rail { position: absolute; inset: 9px calc(var(--thumb) / 2) auto; height: 5px; border-radius: 3px; background: #2b2d3b; pointer-events: none }
    .timeline-rail::after {
      content: ""; position: absolute; inset-block: 0; left: var(--trim-start, 0%); right: var(--trim-end, 0%);
      border-radius: inherit; background: #8995df;
    }
    .timeline-track input {
      position: absolute; inset: 0; width: 100%; height: 23px; margin: 0;
      appearance: none; background: transparent; cursor: ew-resize;
    }
    .timeline-track .trim-handle { pointer-events: none }
    .timeline-track input::-webkit-slider-runnable-track { height: 20px; background: transparent }
    .timeline-track input::-moz-range-track { height: 20px; background: transparent }
    .timeline-track input::-webkit-slider-thumb {
      appearance: none; width: var(--thumb); height: var(--thumb); margin-top: 4px; border-radius: 50%;
      background: #f0f3ff; border: 2px solid #161926; cursor: ew-resize;
    }
    .timeline-track input::-moz-range-thumb {
      box-sizing: border-box; width: var(--thumb); height: var(--thumb); border: 2px solid #161926;
      border-radius: 50%; background: #f0f3ff; cursor: ew-resize;
    }
    .timeline-track .trim-handle::-webkit-slider-thumb {
      pointer-events: auto; height: 18px; margin-top: 1px; border-radius: 3px; background: #c2ccff;
      border: 2px solid #1b2032;
    }
    .timeline-track .trim-handle::-moz-range-thumb {
      pointer-events: auto; height: 18px; border-radius: 3px; background: #c2ccff; border: 2px solid #1b2032;
    }
    .timeline-track input:focus-visible { outline-offset: 0; z-index: 1 }
    .timeline output { display: block; margin-top: 3px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px }
    .editor-tools { min-width: 0; border-left: 1px solid var(--line); padding-left: 15px }
    .editor-tools h4 { margin: 0 0 6px; font-size: 12.5px }
    .edit-metadata { display: grid; gap: 5px; margin: 0 0 13px; padding: 0 0 11px; border-bottom: 1px solid var(--line) }
    .edit-metadata div { display: flex; align-items: baseline; justify-content: space-between; gap: 9px; font-size: 11px }
    .edit-metadata dt { color: var(--muted) }
    .edit-metadata dd { margin: 0; text-align: right }
    .editor-tools .row { min-height: 34px }
    .editor-tools .row > label { font-size: 12px }
    .editor-tools p { margin: 7px 0 10px; color: var(--muted); font-size: 11.5px }
    .trim-value { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px }
    .trim-value input { width: 69px; min-height: 27px }
    .edit-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px }
    .edit-actions button { min-width: 0 }
    .plain-action.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
    .plain-action.primary:hover:enabled { background: #d7ddff }
    .key-button { min-width: 104px; font-variant-numeric: tabular-nums }
    .key-button[data-listening] { border-color: var(--accent); color: var(--accent) }
    .binding-note { min-height: 17px; margin-block: 8px; color: var(--muted); font-size: 11.5px }
    .settings-reset { justify-self: start }
    @media (max-width: 760px) {
      .edit-layout { grid-template-columns: minmax(0, 1fr) }
      .editor-tools { padding: 12px 0 0; border-left: 0; border-top: 1px solid var(--line) }
      .edit-actions { grid-template-columns: minmax(0, 1fr) auto }
    }
    .empty { display: grid; justify-items: center; text-align: center; gap: 9px; max-width: 340px; margin: clamp(34px, 10vh, 105px) auto 0 }
    .empty-icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: var(--surface); color: var(--muted) }
    .empty p { margin: 0; color: var(--muted); line-height: 1.5 }
    .settings-panel {
      display: grid; grid-template-columns: 174px minmax(0, 1fr);
      gap: clamp(20px, 3.5vw, 46px); min-height: 100%; padding: 5px 0 0;
    }
    .settings-nav {
      align-self: start; display: grid; gap: 4px; border-right: 1px solid var(--line);
      padding: 2px 13px 10px 0;
    }
    .settings-nav button {
      display: flex; align-items: center; gap: 9px; min-height: 37px; padding: 7px 9px;
      border: 1px solid transparent; border-radius: 6px; background: transparent;
      color: var(--muted); font-size: 12.5px; font-weight: 600; text-align: left;
      transition: background-color .18s, border-color .18s, color .18s;
    }
    .settings-nav button .icon { width: 16px; height: 16px }
    .settings-nav button:hover { color: var(--ink); background: #ffffff09 }
    .settings-nav button[aria-selected="true"] { color: var(--ink); background: #b6c0ff14; border-color: #b6c0ff30 }
    .settings-nav button[aria-selected="true"] .icon { color: var(--accent) }
    .settings-pages { min-width: 0; width: min(100%, 688px) }
    .settings-group h3 { margin: 0 0 12px; font-size: 19px; font-weight: 600 }

    .settings-group .row:last-of-type { border-bottom: 1px solid var(--line) }
    .settings-group .select-wrap select { width: 160px }
    .settings-group .control-group { width: 160px }
    .settings-group .control-group .select-wrap { flex: 1; min-width: 0 }
    .settings-group .control-group select { width: 100%; min-width: 0; max-width: none }
    .settings-group .binding-note { margin: 9px 0 }
    .estimate { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums }

        padding: 0 0 8px;

      .settings-nav button .icon { width: 12px; height: 12px }

      .settings-group .control-group { width: min(135px, 40vw) }

      .settings-group .control-group .rate-input { width: 45px }
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 40px }
    .row > label, .row > span { font-size: 13px; font-weight: 600 }
    .select-wrap { position: relative; flex: none }

      position: absolute; top: 50%; right: 9px; transform: translateY(-50%);
      width: 12px; height: 12px; color: var(--muted); pointer-events: none;
    }
    select, .rate-input {

      background: #20222d; padding: 4px 26px 4px 9px; font-size: 12px;
    }
    select { min-width: 126px; max-width: 180px }
    .rate-input { width: 62px; padding-right: 5px; font-variant-numeric: tabular-nums }
    .control-group { display: flex; gap: 6px; align-items: center }
    .control-group select { min-width: 74px; max-width: 125px }
    .switch {
      position: relative; flex: none; appearance: none; display: block; width: 35px; height: 20px;
      border: 1px solid #ffffff34; border-radius: 999px;
      margin: 0; background: #2b3140; cursor: pointer; transition: background-color .16s;
    }
    .switch::after {
      content: ""; position: absolute; left: 3px; top: 3px; width: 12px; height: 12px;
      border-radius: 50%; background: #b6bece; transition: transform .16s;
    }
    .switch:checked { background: var(--accent); border-color: var(--accent) }
    .switch:checked::after { transform: translateX(15px); background: var(--accent-ink) }
    .toast {
      position: fixed; z-index: 1; right: var(--edge); bottom: 31px; max-width: min(390px, calc(100vw - 40px));
      margin: 0; padding: 11px 15px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--shell); color: var(--ink); box-shadow: 0 12px 30px #080a1070;
    }

    .replay-status:empty { display: none }
    @media (max-width: 620px) {
      .replay-screen { width: calc(100% - 30px); height: calc(100dvh - 32px) }
      .screen-header { min-height: 51px; gap: 5px 8px; grid-template-columns: minmax(0, 1fr) auto }
      .screen-header .tabs { grid-column: 1 / -1; grid-row: 2; justify-self: center }
      .screen-tools { grid-column: 2; grid-row: 1 }
      .screen-tools .label, .screen-tools kbd { display: none }
      .screen-title { gap: 6px }
      .screen-title .icon { width: 16px; height: 16px }
      .tabs, .filters { gap: 5px }
      .tab, .filter { padding-inline: 6px }
      .library-tools { align-items: stretch; flex-wrap: wrap; gap: 7px }
    }
    @media (max-width: 379px) {
      .pause { --menu-gap: 7px; --menu-row: 34px; padding-inline: 13px }
      .screen-title .icon, .back kbd { display: none }
      .row { gap: 7px }
      .row > label { font-size: 12px }

    }
    @media (max-height: 430px) {
      .pause { --menu-row: 34px; --menu-gap: 7px; padding-bottom: 85px }

      .utilities { top: calc(100% + 15px) }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important } }
  </style>
</head>

    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9L12 3Z"/></symbol>
    <symbol id="i-language" viewBox="0 0 24 24"><path d="M3 5h11m-5-2v2m3 0c-.8 4.1-3.8 7.3-8 9m2-6c1 2.6 3.1 4.5 5.3 5.7M13 21l4-9 4 9m-6.5-2.8h5"/></symbol>
    <symbol id="i-world" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5a12 12 0 0 1 0 17 12 12 0 0 1 0-17Z"/></symbol>
    <symbol id="i-friends" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 19v-1a6 6 0 0 1 12 0v1m2-14a3 3 0 0 1 0 6m4 8v-1a6 6 0 0 0-4-5"/></symbol>
    <symbol id="i-players" viewBox="0 0 24 24"><circle cx="7" cy="8" r="2.5"/><path d="M3 19v-1a4 4 0 0 1 8 0v1m3-12h7m-7 5h7m-7 5h7"/></symbol>
    <symbol id="i-feedback" viewBox="0 0 24 24"><path d="M4 5h16v12h-9l-5 3v-3H4ZM8 9h8m-8 4h6"/></symbol>
    <symbol id="i-bug" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="13" rx="5"/><path d="m8 4 2 3m6-3-2 3M4 9l3 2m10 0 3-2M4 16h3m10 0h3m-8-4v8"/></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M5 21V4m0 1h13l-2.5 4 2.5 4H5"/></symbol>
    <symbol id="i-links" viewBox="0 0 24 24"><path d="m10 8 3-3a4 4 0 0 1 6 6l-3 3m-2 2-3 3a4 4 0 0 1-6-6l3-3m1 5 6-6"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></symbol>
  </svg>

  <div class="world" aria-hidden="true"></div>
  <div class="shade" id="shade" aria-hidden="true"></div>
  <main class="title-menu" id="title-menu" aria-label="Главное меню" hidden>
    <div class="title-brand"><img src="/src/main/resources/assets/orion-client/textures/cosmetics/orion_badge.png" alt="">GleamClient</div>
    <nav aria-label="Главное меню">
      <button class="item" type="button" data-start>Сетевая игра</button>
      <button class="item" type="button" data-start>Одиночная игра</button>
      <button class="item" id="title-open-replay" type="button" aria-controls="replay" aria-haspopup="dialog" aria-expanded="false">Откаты</button>
      <button class="item" type="button" data-preview="В игре откроются модули GleamClient">Модули</button>
      <button class="item" type="button" data-preview="В игре откроются настройки Minecraft">Настройки Minecraft</button>
    </nav>
  </main>
  <main class="pause" id="pause" aria-labelledby="pause-title" hidden>
    <div class="pause-content">
      <h1 id="pause-title">Меню</h1>
      <nav class="menu" aria-label="Меню паузы">
        <button class="item wide" id="resume" type="button">Вернуться к игре</button>
        <button class="item" type="button" data-preview="В игре откроются достижения">Достижения</button>
        <button class="item" type="button" data-preview="В игре откроется статистика">Статистика</button>
        <button class="item" type="button" data-preview="В игре откроются настройки Minecraft">Настройки</button>
        <button class="item" type="button" data-preview="В игре откроется кейбинд менеджер">Кейбинд менеджер</button>
        <button class="item wide" id="open-replay" type="button" aria-controls="replay" aria-haspopup="dialog" aria-expanded="false">Откаты</button>
        <button class="item wide" id="exit" type="button"><svg class="icon" aria-hidden="true"><use href="#i-exit"/></svg><span>Сохранить и выйти</span></button>
      </nav>
      <nav class="utilities" aria-label="Дополнительные действия">
        <div class="utility-group" id="utility-left"></div>
        <button class="utility" type="button" title="Язык" aria-label="Язык" data-preview="В игре откроется выбор языка"><svg class="icon" aria-hidden="true"><use href="#i-language"/></svg></button>
        <div class="utility-group" id="utility-right"></div>
      </nav>
    </div>
  </main>
  <button class="resume-preview" id="show-pause" type="button" hidden><kbd>Esc</kbd> Открыть паузу</button>

  <dialog class="replay-screen" id="replay" aria-labelledby="replay-title">
    <header class="screen-header">
      <div class="screen-title"><svg class="icon" aria-hidden="true"><use href="#i-replay"/></svg><h2 id="replay-title">Откаты</h2></div>
      <div class="tabs" role="tablist" aria-label="Разделы откатов">
        <button class="tab" id="tab-clips" type="button" role="tab" aria-selected="true" aria-controls="replay-library">Клипы</button>
        <button class="tab" id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="replay-settings" tabindex="-1">Настройки</button>
      </div>
      <div class="screen-tools">
        <label class="capture-toggle" title="Запоминать последние секунды игры">Буфер <input class="switch" id="enabled" type="checkbox" role="switch"></label>
        <button class="back" id="close-replay" type="button" aria-label="Назад" autofocus><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg><span class="label">Назад</span><kbd>Esc</kbd></button>
      </div>
    </header>
    <div class="screen-body" id="replay-body">
      <section id="replay-library" role="tabpanel" aria-labelledby="tab-clips">
        <div id="clip-list">
          <div class="library-tools">
            <div class="filters" role="group" aria-label="Фильтр клипов">
              <button class="filter" id="filter-all" type="button" aria-pressed="true">Все клипы</button>
              <button class="filter" id="filter-favorites" type="button" aria-pressed="false">Избранное</button>
            </div>
            <span class="clip-count" id="clip-count"></span>
          </div>
          <ul class="clip-grid" id="clip-grid" aria-label="Список клипов"></ul>
          <div class="empty" id="clip-empty" hidden>
            <span class="empty-icon"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg></span>
            <strong>Пока нет избранных клипов</strong>
            <p>Нажми на звезду рядом с клипом, чтобы он появился здесь.</p>
          </div>
        </div>
        <section id="clip-editor" aria-labelledby="edit-title" hidden>
          <header class="edit-header">
            <button type="button" class="edit-back" id="editor-back"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>К клипам</button>
            <h3 id="edit-title" tabindex="-1"></h3>
          </header>
          <div class="edit-layout">
            <div class="edit-player">
              <figure class="edit-frame"><img src="../assets/gameplay-orion.webp" alt="Кадр из Minecraft"><figcaption>Демонстрационный кадр</figcaption></figure>
              <section class="timeline" aria-label="Таймлайн">
                <div class="timeline-track" id="trim-track">
                  <div class="timeline-rail" aria-hidden="true"></div>
                  <input id="edit-position" type="range" min="0" step=".1" value="0" aria-label="Позиция на таймлайне">
                  <input id="start-handle" class="trim-handle" type="range" min="0" step=".1" value="0" aria-label="Начало обрезки">
                  <input id="end-handle" class="trim-handle" type="range" min="0" step=".1" aria-label="Конец обрезки">
                </div>
                <output id="edit-clock"></output>
              </section>
            </div>
            <aside class="editor-tools" aria-label="Обрезка клипа">
              <h4>О клипе</h4>
              <dl class="edit-metadata">
                <div><dt>Дата</dt><dd id="edit-meta"></dd></div>
                <div><dt>Видео</dt><dd id="edit-format"></dd></div>
                <div><dt>Длительность</dt><dd id="edit-duration"></dd></div>
              </dl>
              <h4>Обрезка</h4>
              <div class="row"><label for="trim-start">Начало</label><span class="trim-value"><input id="trim-start" class="rate-input" type="number" min="0" step=".1"> с</span></div>
              <div class="row"><label for="trim-end">Конец</label><span class="trim-value"><input id="trim-end" class="rate-input" type="number" min=".1" step=".1"> с</span></div>
              <p id="trim-result"></p>
              <div class="edit-actions">
                <button type="button" class="plain-action primary" id="trim-save">Сохранить копию</button>
                <button type="button" class="plain-action" id="trim-reset">Сбросить</button>
              </div>
            </aside>
          </div>
        </section>
      </section>
      <section class="settings-panel" id="replay-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
        <nav class="settings-nav" role="tablist" aria-label="Разделы настроек" aria-orientation="vertical">
          <button type="button" id="settings-video-tab" role="tab" aria-selected="true" aria-controls="settings-video"><svg class="icon" aria-hidden="true"><use href="#i-video"/></svg>Запись</button>
          <button type="button" id="settings-audio-tab" role="tab" aria-selected="false" aria-controls="settings-audio" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-audio"/></svg>Звук</button>
          <button type="button" id="settings-keys-tab" role="tab" aria-selected="false" aria-controls="settings-keys" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-keyboard"/></svg>Горячие клавиши</button>
        </nav>
        <div class="settings-pages">
          <section class="settings-group" id="settings-video" role="tabpanel" aria-labelledby="settings-video-tab">
            <h3>Запись</h3>
            <div class="row"><label for="duration">Длительность</label><span class="select-wrap"><select id="duration"><option value="30">30 секунд</option><option value="60" selected>60 секунд</option><option value="120">120 секунд</option></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></span></div>
            <div class="row"><label for="resolution">Разрешение</label><span class="select-wrap"><select id="resolution"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="1440">1440p</option><option value="source">Исходное</option></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></span></div>
            <div class="row"><label for="fps">FPS записи</label><span class="select-wrap"><select id="fps"><option value="30">30 FPS</option><option value="60" selected>60 FPS</option></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></span></div>
            <div class="row"><label for="quality">Качество</label><span class="select-wrap"><select id="quality"><option value="performance">Производительность</option><option value="balanced" selected>Баланс</option><option value="quality">Качество</option></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></span></div>
            <div class="row"><label for="bitrate-mode">Битрейт</label><div class="control-group"><span class="select-wrap"><select id="bitrate-mode"><option value="auto">Авто</option><option value="manual">Вручную</option></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></span><input class="rate-input" id="bitrate" type="number" min="2" max="60" value="16" aria-label="Битрейт в Мбит/с" hidden></div></div>
            <p class="estimate" id="estimate"></p>
          </section>
          <section class="settings-group" id="settings-audio" role="tabpanel" aria-labelledby="settings-audio-tab" hidden>
            <h3>Звук</h3>
            <div class="row"><label for="audio">Источник звука</label><span class="select-wrap"><select id="audio"><option value="game">Minecraft</option><option value="system">Вся система</option></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></span></div>
            <div class="row"><label for="mic">Микрофон</label><input class="switch" id="mic" type="checkbox" role="switch"></div>
          </section>
          <section class="settings-group" id="settings-keys" role="tabpanel" aria-labelledby="settings-keys-tab" hidden>
            <h3>Горячие клавиши</h3>
            <div class="row"><span id="save-binding-label">Сохранить откат</span><button class="key-button" data-bind="save" type="button" aria-labelledby="save-binding-label save-binding"><span id="save-binding"></span></button></div>
            <div class="row"><span id="toggle-binding-label">Переключить буфер</span><button class="key-button" data-bind="toggle" type="button" aria-labelledby="toggle-binding-label toggle-binding"><span id="toggle-binding"></span></button></div>
            <p class="binding-note" id="binding-note" role="status"></p>
            <button class="plain-action settings-reset" id="reset-bindings" type="button">Сбросить клавиши</button>
          </section>
        </div>
      </section>
    </div>
    <p class="toast replay-status" id="replay-status" role="status"></p>
  </dialog>
  <template id="clip-template">
    <li class="clip-card">
      <button class="clip-open" type="button">
        <span class="clip-thumb"><img alt=""><span class="clip-length"></span></span>
        <span><strong class="clip-name"></strong><small class="clip-meta"></small></span>
      </button>
      <button class="favorite" type="button"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg></button>
    </li>
  </template>
  <p class="toast" id="toast" role="status" hidden></p>

  <script src="replay-preview.js"></script>
</body>
</html>
