    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(0deg,#0e10167d,transparent 29%)}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible{outline:2px solid #bdd0ff;outline-offset:2px}
    [hidden]{display:none!important}
    .sprite{position:absolute;width:0;height:0}
    .icon{display:block;width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .island{--hud-height:34px;--closed-height:57px;--expanded-height:205px;--body-width:min(392px,calc(100vw - 4px));
      --hud-width:min(344px,calc(var(--body-width) - 22px));position:fixed;top:0;left:0;width:var(--body-width);
      height:var(--expanded-height);transform:translateX(var(--left,calc((100vw - var(--body-width)) / 2)));pointer-events:none}
    .shell{position:absolute;inset:0;background:linear-gradient(160deg,#20222c 0%,#17181f 60%);clip-path:var(--shape-closed);
      transition:clip-path 360ms var(--ease);box-shadow:inset 0 0 0 1px #ffffff15}
    .island[data-open] .shell{clip-path:var(--shape-open)}
    .hud{height:var(--hud-height);width:var(--hud-width);position:relative;margin:0 auto;
      display:flex;align-items:center;gap:8px;padding:0 13px;white-space:nowrap;user-select:none;
      pointer-events:auto;touch-action:none}
    body[data-chat] .hud{cursor:grab}
    body[data-chat] .island[data-dragging] .hud{cursor:grabbing}
    .brand{display:flex;align-items:center;gap:6px;font-weight:700;letter-spacing:-.025em}
    .brand img{width:19px;height:19px;object-fit:contain}
    .version,.unit{font-size:10px;color:var(--muted)}
    .version{font-variant-numeric:tabular-nums}
    .username{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;color:#dddde8;font-size:11px}
    .metrics{flex:none;display:flex;align-items:center;gap:8px;padding-left:8px;border-left:1px solid var(--line);
      font-size:11px;font-variant-numeric:tabular-nums}
    .metric{display:flex;align-items:baseline;gap:3px}
    .metric .icon{align-self:center;width:12px;height:12px;color:#b8c7eb}
    .now-playing{position:absolute;top:var(--hud-height);left:50%;transform:translateX(-50%);width:var(--hud-width);
      height:calc(var(--closed-height) - var(--hud-height));display:flex;align-items:center;gap:6px;
      padding:0 13px 3px;border-top:1px solid var(--line);pointer-events:auto;transition:opacity 150ms}
    .island[data-open] .now-playing{opacity:0;pointer-events:none}
    .service-icon{display:block;flex:none;width:21px;height:21px}
    .now-playing .service-icon{width:15px;height:15px}
    .now-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
    .playing-label{color:#c1d0f1;font-size:10px}
    .equalizer{display:flex;align-items:center;gap:2px;height:12px;color:#bbcbef}
    .equalizer i{width:2px;height:10px;background:currentColor;border-radius:2px;transform:scaleY(.35)}
    .island[data-playing]:not([data-open]) .equalizer i{animation:meter 750ms ease-in-out infinite alternate}
    .equalizer i:nth-child(2){animation-delay:-290ms!important}
    .equalizer i:nth-child(3){animation-delay:-475ms!important}
    @keyframes meter{0%,100%{transform:scaleY(.35)}55%{transform:scaleY(1)}}
    .player{position:absolute;inset:var(--hud-height) 13px 0;display:grid;align-content:start;gap:5px;
      padding:8px 9px 10px;border-top:1px solid var(--line);opacity:0;visibility:hidden;pointer-events:none;
      transform:translateY(-8px);clip-path:inset(0 0 100%);transition:opacity 145ms,transform 260ms var(--ease),
      clip-path 290ms var(--ease),visibility 0s 155ms}
    .island[data-open] .player{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0);clip-path:inset(0);
      transition:opacity 205ms 65ms,transform 330ms var(--ease),clip-path 290ms var(--ease),visibility 0s}
    .track{display:grid;grid-template-columns:47px minmax(0,1fr) auto;align-items:center;gap:9px}
    .cover{width:47px;height:47px;border-radius:8px;overflow:hidden;background:#372d55}
    .cover svg{display:block;width:100%;height:100%}
    .track-title{font-size:15px;font-weight:700;letter-spacing:-.025em}
    .track-title,.artist{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .artist{margin-top:3px;color:var(--muted);font-size:11px}
    .source{display:flex;align-items:center;gap:5px;color:#d9d9e2;font-size:10px;white-space:nowrap}
    .timeline{display:grid;grid-template-columns:32px minmax(0,1fr) 36px;align-items:center;gap:6px}
    .timeline output{color:#c7c9d8;font-size:11px;font-variant-numeric:tabular-nums}
    #remaining{text-align:right}
    input[type=range]{--fraction:0;--thumb:13px;--track:5px;--fill:#c2d2f7;--rest:#464a58;
      appearance:none;width:100%;height:23px;margin:0;border:0;background:none;cursor:ew-resize;touch-action:none}
    input[type=range]::-webkit-slider-runnable-track{--stop:calc(var(--thumb) / 2 + (100% - var(--thumb)) * var(--fraction));
      height:var(--track);border-radius:8px;background:linear-gradient(90deg,var(--fill) var(--stop),var(--rest) var(--stop))}
    input[type=range]::-webkit-slider-thumb{appearance:none;margin-top:calc((var(--track) - var(--thumb)) / 2);
      width:var(--thumb);height:var(--thumb);border:1px solid #fff9;border-radius:50%;background:#edf2fd;
      box-shadow:0 1px 4px #0c0d16bb;transition:transform 130ms var(--ease)}
    input[type=range]::-moz-range-track{height:var(--track);border-radius:8px;background:var(--rest)}
    input[type=range]::-moz-range-progress{height:var(--track);border-radius:8px;background:var(--fill)}
    input[type=range]::-moz-range-thumb{width:11px;height:11px;border:1px solid #fff9;border-radius:50%;background:#edf2fd}
    input[type=range]:active::-webkit-slider-thumb{transform:scale(1.13)}
    .transport{display:flex;align-items:center;justify-content:center;gap:clamp(9px,3vw,23px)}
    .control{width:28px;height:28px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:none;transition:background 140ms,transform 130ms var(--ease)}
    .control:hover{background:#ffffff17}
    .control:active{transform:scale(.91)}
    .control.secondary{color:var(--muted)}
    .control[aria-pressed=true]{color:#b9cdff}
    .control.main{width:35px;height:35px;background:#ececf4;color:#1a1b25}
    .control.main:hover{background:#fff}
    .fill-icon{fill:currentColor;stroke:none}
    .volume{display:grid;grid-template-columns:26px minmax(0,1fr) 36px;align-items:center;gap:7px;color:#c7c9d8}
    .volume .control{width:24px;height:24px}
    .volume .icon{width:15px;height:15px}
    .volume output{text-align:right;font-size:11px;font-variant-numeric:tabular-nums}
    .demo{position:fixed;left:14px;right:14px;bottom:12px;display:flex;align-items:flex-end;gap:12px}
    .chat{flex:1;min-width:0;display:grid;gap:4px;padding:8px 10px;border-radius:5px;background:#161820c9;font-size:11px}
    .chat strong{font-weight:400;color:#e8ecf7}
    .chat span{color:#c6cad9}
    .toggle{flex:none;display:flex;align-items:center;gap:8px;min-height:32px;border:1px solid #ffffff35;border-radius:6px;
      background:#191b24e6;padding:0 9px;font-size:11px}
    kbd{border:1px solid #ffffff36;border-radius:3px;padding:0 3px;color:#c7c8d4;font:10px Onest,sans-serif}
    @media(max-width:390px){
      .hud{padding-inline:9px;gap:5px}.metrics{gap:5px;padding-left:5px}.brand{font-size:12px;gap:4px}
      .brand img{width:16px;height:16px}.username{font-size:10px}.player{padding-inline:9px}.source{font-size:9px}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

  <script>
    const select = selector => document.querySelector(selector);
    const island = select('.island'), hud = select('.hud'), player = select('.player');
    const chat = select('.chat'), chatToggle = select('.toggle');
    let chatOpen = true, open = false, closeTimer = 0, openTimer = 0, position = null, drag = null;

    function notch(width, bodyWidth, height, radius, shoulder) {
      const left = (width - bodyWidth) / 2, right = left + bodyWidth;
      return `path("M ${left - shoulder} 0 H ${right + shoulder}
        Q ${right} 0 ${right} ${shoulder} V ${height - radius}
        Q ${right} ${height} ${right - radius} ${height}
        H ${left + radius} Q ${left} ${height} ${left} ${height - radius}
        V ${shoulder} Q ${left} 0 ${left - shoulder} 0 Z")`.replace(/\s+/g,' ');
    }

    function updatePosition(center) {
      const width = island.offsetWidth, half = width / 2;
      position = Math.max(half, Math.min(innerWidth - half, center));
      island.style.setProperty('--left', (position - half) + 'px');
    }

    function measure() {
      const width = island.offsetWidth, closedWidth = hud.offsetWidth;
      const closedHeight = parseFloat(getComputedStyle(island).getPropertyValue('--closed-height'));
      island.style.setProperty('--shape-closed', notch(width, closedWidth, closedHeight, 13, 10));
      island.style.setProperty('--shape-open', notch(width, width - 22, island.offsetHeight, 20, 11));
      updatePosition(position ?? innerWidth / 2);
    }

    function show(next) {
      if (next === open) return;
      open = next;
      island.toggleAttribute('data-open', open);
      hud.setAttribute('aria-expanded', String(open));
      player.inert = !open;
    }

    function enterIsland() {
      clearTimeout(closeTimer);
      if (!chatOpen || open || openTimer) return;
      openTimer = setTimeout(() => {openTimer = 0; if (chatOpen) show(true);}, 85);
    }

    function leaveIsland() {
      clearTimeout(openTimer);
      openTimer = 0;
      if (!drag && open) closeTimer = setTimeout(() => show(false), 130);
    }

    function stopDrag() {
      if (!drag) return;
      drag = null;
      island.removeAttribute('data-dragging');
    }

    function setChat(next) {
      chatOpen = next;
      document.body.toggleAttribute('data-chat', next);
      chat.hidden = !next;
      chatToggle.querySelector('span').textContent = next ? 'Закрыть чат' : 'Открыть чат';
      chatToggle.querySelector('kbd').textContent = next ? 'Esc' : 'T';
      clearTimeout(openTimer);
      clearTimeout(closeTimer);
      openTimer = 0;
      if (!next) {
        stopDrag();
        if (player.contains(document.activeElement)) document.activeElement.blur();
        show(false);
      }
    }

    island.addEventListener('pointerenter', enterIsland);
    island.addEventListener('pointermove', enterIsland);
    island.addEventListener('pointerleave', leaveIsland);
    hud.addEventListener('pointerdown', event => {
      if (!chatOpen || event.button !== 0) return;
      event.preventDefault();
      drag = {id:event.pointerId, x:event.clientX, center:position};
      island.setAttribute('data-dragging', '');
    });
    window.addEventListener('pointermove', event => {
      if (drag?.id !== event.pointerId) return;
      if (event.buttons & 1) updatePosition(drag.center + event.clientX - drag.x);
      else stopDrag();
    });
    window.addEventListener('pointerup', event => {
      if (drag?.id !== event.pointerId) return;
      stopDrag();
      if (!island.contains(document.elementFromPoint(event.clientX, event.clientY))) leaveIsland();
    });
    window.addEventListener('pointercancel', event => {
      if (drag?.id !== event.pointerId) return;
      stopDrag();
      leaveIsland();
    });
    chatToggle.addEventListener('click', () => setChat(!chatOpen));
    window.addEventListener('keydown', event => {
      if (event.code === 'Escape') { event.preventDefault(); setChat(false); }
      if (event.code === 'KeyT' && !chatOpen) { event.preventDefault(); setChat(true); }
    });
    window.addEventListener('blur', () => setChat(false));
    window.addEventListener('resize', measure);
    measure();

    const services = {
      spotify:{name:'Spotify', volume:64, audible:64},
      youtube:{name:'YouTube Music', volume:76, audible:76},
      apple:{name:'Apple Music', volume:52, audible:52},
      yandex:{name:'Яндекс Музыка', volume:58, audible:58}
    };
    const tracks = [
      {title:'Midnight Signals', artist:'FM Archive', seconds:215, service:'spotify', colors:['#647cbe','#272342']},
      {title:'Late Departure', artist:'Northline', seconds:196, service:'youtube', colors:['#bc8158','#47272b']},
      {title:'Still in Motion', artist:'Glass Towers', seconds:237, service:'apple', colors:['#6f9a89','#20353c']},
      {title:'Тёплый свет', artist:'Север', seconds:208, service:'yandex', colors:['#b98050','#422f35']}
    ];
    const seek = select('#seek'), volume = select('#volume'), playback = select('#playback'), mute = select('#mute');
    let currentTrack = 0, playing = true, repeat = false, shuffled = false, seekPointer = null;
    const currentService = () => services[tracks[currentTrack].service];
    const formatTime = seconds => Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
    const updateRange = input => input.style.setProperty('--fraction', input.value / input.max);

    function updateTime() {
      updateRange(seek);
      const elapsed = formatTime(Number(seek.value));
      select('#elapsed').textContent = elapsed;
      select('#remaining').textContent = '−' + formatTime(Number(seek.max) - Number(seek.value));
      seek.setAttribute('aria-valuetext', elapsed + ' из ' + formatTime(Number(seek.max)));
    }

    function loadTrack(index, seconds = 0) {
      currentTrack = (index + tracks.length) % tracks.length;
      const track = tracks[currentTrack];
      const service = currentService();
      select('.now-title').textContent = track.title;
      select('.now-title').title = track.title + ' · ' + service.name;
      select('.track-title').textContent = track.title;
      select('.artist').textContent = track.artist;
      select('#service-name').textContent = service.name;
      for (const mark of document.querySelectorAll('[data-service-mark]')) mark.setAttribute('href', '#' + track.service + '-mark');
      select('#cover-top').setAttribute('stop-color', track.colors[0]);
      select('#cover-bottom').setAttribute('stop-color', track.colors[1]);
      seek.max = track.seconds;
      seek.value = seconds;
      updateTime();
      volume.value = service.volume;
      volume.setAttribute('aria-label', 'Громкость ' + service.name);
      volume.title = 'Громкость ' + service.name;
      updateVolume();
    }

    function updatePlayback() {
      island.toggleAttribute('data-playing', playing);
      select('.playing-label').textContent = playing ? 'Играет' : 'Пауза';
      playback.querySelector('use').setAttribute('href', playing ? '#pause' : '#play');
      playback.setAttribute('aria-label', playing ? 'Пауза' : 'Воспроизвести');
    }

    function updateVolume() {
      const level = Number(volume.value);
      const service = currentService();
      service.volume = level;
      if (level > 0) service.audible = level;
      updateRange(volume);
      select('#level').textContent = level + '%';
      volume.setAttribute('aria-valuetext', level + '%');
      mute.querySelector('use').setAttribute('href', level ? '#speaker' : '#muted');
      mute.setAttribute('aria-label', (level ? 'Выключить звук ' : 'Вернуть звук ') + service.name);
    }

    function nextTrack() {
      loadTrack(currentTrack + (shuffled ? 1 + Math.floor(Math.random() * (tracks.length - 1)) : 1));
    }

    select('#back').addEventListener('click', () => loadTrack(currentTrack - 1));
    select('#forward').addEventListener('click', nextTrack);
    select('#randomize').addEventListener('click', event => event.currentTarget.setAttribute('aria-pressed', String(shuffled = !shuffled)));
    select('#loop').addEventListener('click', event => event.currentTarget.setAttribute('aria-pressed', String(repeat = !repeat)));
    playback.addEventListener('click', () => {
      playing = !playing;
      updatePlayback();
    });
    seek.addEventListener('input', updateTime);
    seek.addEventListener('pointerdown', event => { seekPointer = event.pointerId; });
    for (const type of ['pointerup', 'pointercancel']) {
      window.addEventListener(type, event => { if (event.pointerId === seekPointer) seekPointer = null; });
    }
    window.addEventListener('blur', () => { seekPointer = null; });
    volume.addEventListener('input', updateVolume);
    mute.addEventListener('click', () => {
      volume.value = Number(volume.value) ? 0 : currentService().audible;
      updateVolume();
    });
    setInterval(() => {
      if (!playing || seekPointer !== null) return;
      if (Number(seek.value) >= Number(seek.max)) {
        if (repeat) loadTrack(currentTrack);
        else nextTrack();
      } else { seek.stepUp(); updateTime(); }
    }, 1000);
    loadTrack(0, 48);
    updatePlayback();
  </script>
</body>
</html>
