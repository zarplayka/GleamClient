<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gleam Launcher — главная</title>
  <style id="home-css" media="not all">
    #page-play.home-concept {
      --concept-gap: 14px;
      --concept-line: color-mix(in srgb,var(--text) 12%,transparent);
      --concept-panel: var(--frame);
      display: block;
      min-height: var(--content-height);
      padding: var(--concept-gap);
      background: var(--page-bg);
    }
    #page-play.home-concept[hidden] { display: none }
    .home-concept .home-board {
      display: grid;
      grid-template: minmax(0,1fr) / minmax(0,1fr) clamp(220px,25cqw,310px);
      gap: var(--concept-gap);
      width: 100%; max-width: 1540px; margin-inline: auto;
      min-height: max(540px,calc(var(--content-height) - 2 * var(--concept-gap)));
      padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none;
    }
    .concept-play {
      min-width: 0;
      display: grid; grid-template-rows: minmax(480px,1fr) auto;
      border: 1px solid var(--concept-line); border-radius: 15px; overflow: clip;
      background: var(--concept-panel);
    }
    .concept-stage {
      position: relative; isolation: isolate;
      display: grid; grid-template-rows: minmax(0,1fr) auto;
      min-width: 0; overflow: clip;
      color: #fff5ec;
      background: #202946 url("launcher-home-scene.webp") center / cover no-repeat;
    }
    .concept-stage::before {
      position: absolute; z-index: -1; inset: 0; content: "";
      background: linear-gradient(180deg,#13152770 0%,transparent 33%,transparent 60%,#121425c9 100%);
      pointer-events: none;
    }
    .concept-stage #play-heading {
      position: absolute; width: 1px; height: 1px; padding: 0;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap;
    }
    .concept-stage .home-preview { position: absolute; inset: 0; width: auto; height: auto; z-index: 0 }
    .concept-stage .skin-stage {
      --unit: clamp(8px,2.14cqh,17px);
      container-type: size; height: 100%; width: 100%; animation: none;
      touch-action: none;
    }
    .concept-stage .home-preview { container-type: size }
    .concept-stage .model { bottom: 56%; }
    .concept-stage .model::before {
      position: absolute; bottom: calc(100% + var(--unit)); left: 50%;
      content: attr(data-player-name); color: #fff7ed; background: #182b55e6;
      padding: 3px 9px; white-space: nowrap; font: 700 calc(1.7 * var(--unit)) Consolas, monospace;
      transform: translateX(-50%) rotateY(calc(-1 * var(--yaw)));
    }
    .concept-stage #home-cosmetic-preview { top: -7%; pointer-events: none }
    .concept-stage .skin-shadow {
      left: 50%; bottom: 17%; width: min(28%,230px); height: 6%;
      transform: translateX(-50%); background: #1013207a; filter: blur(13px);
    }
    .concept-launch {
      position: relative; z-index: 1; grid-area: 2 / 1;
      justify-self: center; display: grid; gap: 7px;
      width: min(100% - 32px,350px);
      margin: 0 0 21px; min-width: 0;
      font-variant-numeric: tabular-nums;
    }
    .concept-launch .launch-actions {
      display: grid; grid-template-columns: minmax(0,1fr) auto;
      gap: 0; align-items: stretch;
      border: 1px solid #ffe6c28a; border-radius: 12px;
      background: #fff0d9; color: #211a1b; box-shadow: 0 8px 20px #11111d7a,0 2px 0 #976b524a;
      overflow: clip;
    }
    .concept-launch #launch {
      display: flex; align-items: center; justify-content: flex-start; gap: 12px;
      min-height: 62px; padding: 8px 14px;
      border-radius: 0; background: #fff0d9; color: #211a1b; text-align: left;
    }
    .concept-launch #launch:not(:disabled):hover { background: #fff9eb }
    .concept-launch #launch[data-close-game], .concept-launch #launch[data-close-game]:hover { background: #b93042; color: #fff }
    .concept-launch #launch > .icon { width: 24px; height: 24px }
    .concept-launch #launch-label { display: block; font-size: 19px; line-height: 1.12; white-space: normal }
    .concept-launch .profile-spec {
      display: block; margin: 3px 0 0; color: inherit;
      font-size: 11px; font-weight: 600; opacity: .76; white-space: nowrap;
    }
    .concept-launch .profile-spec span:not(#profile-version) { color: inherit }
    .concept-launch .profile-button {
      align-self: stretch; width: 58px; min-height: 100%; padding: 0;
      border: 0; border-left: 1px solid #30252123; border-radius: 0;
      color: #3a2f32; background: #f2dfc6;
    }
    .concept-launch .profile-button:hover { background: #fff9eb }
    .concept-launch :is(#launch,.profile-button):focus-visible {
      outline: 2px solid #6255a0; outline-offset: -4px;
    }
    .concept-launch #first-launch-note { display: none }
    .concept-launch .launch-note-slot { min-height: 0; margin: 0; text-align: center }
    .concept-launch .launch-note-slot:has(#version-unavailable[hidden]) { display: none }
    .concept-launch .launch-note, .concept-launch-status {
      margin: 0; color: #f2e7ed; font-size: 11px; line-height: 1.35;
    }
    .concept-launch-status:empty { display: none }
    .concept-launch-status { text-align: center }
    .concept-quick, .concept-panel {
      min-width: 0; border: 1px solid var(--concept-line);
      border-radius: 12px; background: var(--concept-panel);
    }
    .concept-quick {
      display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 6px 9px 6px 13px;
      border: 0; border-top: 1px solid var(--concept-line); border-radius: 0;
    }
    .concept-quick h2 { flex: none; font-size: 12px; letter-spacing: 0; color: var(--side-muted) }
    .concept-quick-list { display: flex; min-width: 0; flex: 1; gap: 4px; overflow-x: auto; scrollbar-width: thin }
    .concept-quick-list button, .concept-person {
      display: flex; min-width: 0; align-items: center; gap: 8px;
      border: 0; background: none; color: var(--text); text-align: left; border-radius: 7px;
    }
    .concept-quick-list button {
      flex: 1 0 auto; justify-content: center; min-height: 34px;
      padding: 0 8px; font-size: 12px; font-weight: 650; white-space: nowrap;
    }
    .concept-quick-list button:hover,.concept-person:hover { background: var(--side-hover) }
    .concept-server-icon {
      display: grid; place-items: center; flex: none; width: 19px; height: 19px; border-radius: 4px;
      background: var(--selected-bg); color: var(--selected-text); font-size: 12px;
    }
    .concept-server-icon.amber { background: #b5743030; color: #c8853d }
    .concept-server-icon.mauve { background: #bd68a329; color: #c153a9 }
    .concept-rail { min-width: 0; display: grid; grid-template-rows: minmax(244px,1fr) auto; gap: 10px }
    .concept-panel { padding: 14px 13px }
    .concept-panel header {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 12px;
    }
    .concept-panel header h2 { font-size: 17px; letter-spacing: -.035em }
    .concept-panel header button {
      flex: none; padding: 3px 4px; min-height: 26px; border: 0; border-radius: 4px;
      background: none; color: var(--side-muted); font-size: 12px; font-weight: 600;
    }
    .concept-panel header button:hover { color: var(--text); background: var(--side-hover) }
    .concept-people { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none }
    .concept-person { width: 100%; padding: 6px; min-height: 43px }
    .concept-face {
      position: relative; display: grid; place-items: center; flex: none; width: 29px; height: 29px;
      border-radius: 6px; background: var(--selected-bg); color: var(--selected-text);
    }
    .concept-face canvas { width: 100%; height: 100%; border-radius: inherit; image-rendering: pixelated }
    .concept-face::after {
      position: absolute; right: -1px; bottom: -1px; width: 7px; height: 7px;
      content: ""; background: #61d3a2; border-radius: 3px; box-shadow: 0 0 0 2px var(--concept-panel);
    }
    .concept-person[data-away] .concept-face::after { background: #c2936a }
    .concept-person[data-offline] .concept-face::after { display: none }
    .concept-person[data-offline] { opacity: .66 }
    .concept-person-copy { display: grid; min-width: 0; gap: 1px; line-height: 1.25 }
    .concept-person-copy strong { font-size: 13px; font-weight: 650 }
    .concept-person-copy small { color: var(--side-muted); font-size: 11px }
    .concept-person-copy > * { overflow: hidden; white-space: nowrap; text-overflow: ellipsis }
    .concept-offline {
      display: flex; align-items: center; gap: 8px; margin: 9px 0 3px; padding-inline: 5px;
      color: var(--side-muted); font-size: 11px;
    }
    .concept-offline::after { content: ""; flex: 1; height: 1px; background: var(--concept-line) }
    .home-concept .concept-news { grid-area: auto; }
    .concept-news-art {
      display: block; width: 100%; aspect-ratio: 2.45; margin: 0 0 10px;
      padding: 0; overflow: hidden; border: 1px solid var(--concept-line);
      border-radius: 8px; background: #302836 url("../assets/gameplay-orion.webp") center 78% / cover;
    }
    .concept-news-art { filter: brightness(1.25) }
    .concept-news-art:hover { filter: brightness(1.4) }
    .concept-news #recent-releases li + li { display: none }
    .concept-news .news-entry { display: grid; gap: 5px; padding: 0 1px 2px }
    .concept-news .news-entry strong { font-size: 14px; line-height: 1.2 }
    .concept-news .news-entry .release-meta { font-size: 11px }
    .concept-versions {
      width: min(560px,calc(100vw - 24px)); padding: 18px; border: 1px solid var(--side-rule); border-radius: 14px;
      background: var(--frame); color: var(--text); box-shadow: 0 20px 60px #08080d96;
    }
    .concept-versions::backdrop { background: #11121bb0 }
    .concept-versions header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px }
    .concept-versions h2 { font-size: 19px }
    .concept-versions .concept-version-options { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px }
    .concept-versions .version-shelf { grid-area: auto; width: 100%; justify-self: center; gap: 5px; animation: none }
    .concept-versions .version-tile { font-size: 13px; padding: 6px }
    .concept-versions .version-tile[aria-pressed="true"] { border-color: #e6ccac }
    @container workspace (max-width: 700px) {
      .home-concept .home-board { grid-template-columns: minmax(0,1fr); grid-template-rows: auto auto }
      .concept-rail { grid-template: 1fr / minmax(0,1fr) minmax(0,1fr) }
      .concept-play { grid-template-rows: minmax(430px,68dvh) auto }
    }
    @container workspace (max-width: 470px) {
      .concept-quick { align-items: stretch; flex-direction: column; gap: 4px }
      .concept-quick-list { flex: auto }
      .concept-rail { grid-template: auto auto / minmax(0,1fr) }
      .concept-stage .skin-stage { --unit: clamp(8px,1.8cqh,11px) }
      .concept-stage .model { bottom: 51% }
      .concept-launch #launch { padding-inline: 9px; gap: 7px }
      .concept-launch #launch > .icon { width: 20px; height: 20px }
      .concept-launch #launch-label { font-size: 17px }
      .concept-launch .profile-button { width: 48px }
    }
    @media (max-height: 670px) {
      .home-concept .home-board { min-height: 0 }
      .concept-play { grid-template-rows: minmax(435px,69dvh) auto }
    }
  </style>
</head>
<body>
  <p id="preview-loading" role="status">Открываем превью Gleam Launcher…</p>
  <template id="home-layout">
    <div class="concept-play">
      <section class="concept-stage" aria-labelledby="play-heading">
        <h1 id="play-heading">LayOffick</h1>
      </section>
      <section class="concept-quick" aria-labelledby="concept-quick-title">
        <h2 id="concept-quick-title">Быстрый вход</h2>
        <div class="concept-quick-list">
          <button type="button" data-concept-server="ht-1.ru"><span class="concept-server-icon mauve" aria-hidden="true">A</span>AlterPrac</button>
          <button type="button" data-concept-server="play.lunamine.ru"><span class="concept-server-icon" aria-hidden="true">L</span>LunaMine</button>
          <button type="button" data-concept-server="mc.hypixel.net"><span class="concept-server-icon amber" aria-hidden="true">H</span>Hypixel</button>
        </div>
      </section>
    </div>
    <div class="concept-rail">
      <section class="concept-panel" aria-labelledby="concept-friends-title">
        <header>
          <h2 id="concept-friends-title">Друзья</h2>
          <button type="button" id="concept-open-friends">Все друзья</button>
        </header>
        <ul class="concept-people" id="concept-people"></ul>
      </section>
    </div>
    <dialog class="concept-versions" id="concept-versions" aria-labelledby="concept-versions-title">
      <header>
        <h2 id="concept-versions-title">Версия Minecraft</h2>
        <form method="dialog"><button class="button" type="submit" aria-label="Закрыть">×</button></form>
      </header>
      <div class="concept-version-options"></div>
    </dialog>
  </template>
  <script type="text/plain" id="home-script">
    (() => {
      const home = $('page-play');
      launcher.removeAttribute('data-auth-required');
      gleamLogin.hidden = true;
      const board = home.querySelector('.home-board');
      const launchColumn = board.querySelector('.launch-column');
      const launchActions = launchColumn.querySelector('.launch-actions');
      const news = board.querySelector('.news');
      const cosmetics = board.querySelector('.cosmetics');
      const versions = [...board.querySelectorAll('.version-shelf')];
      const layout = $('home-layout').content.cloneNode(true);
      board.replaceChildren();
      board.append(layout);
      home.classList.add('home-concept');

      const stage = board.querySelector('.concept-stage');
      launchColumn.querySelector('h1').remove();
      const profileName = cosmetics.querySelector('#minecraft-name'), loadout = cosmetics.querySelector('.home-loadout');
      const avatar = cosmetics.querySelector('.home-preview');
      avatar.querySelector('.home-zoom').remove();
      loadout.hidden = true;
      home.append(loadout);
      stage.append(avatar,launchColumn);
      skinStage.setAttribute('aria-label','Персонаж Minecraft. Поворот мышью или стрелками, масштаб колёсиком');

      class HomeAvatar extends GleamCosmeticPreview {
        setName(name) {
          if (this.nameplate?.name === name) return;
          if (this.nameplate) {
            this.gl.deleteBuffer(this.nameplate.mesh.buffer);
            this.gl.deleteTexture(this.nameplate.texture);
          }
          const label = document.createElement('canvas'), font = 'bold 15px Consolas, monospace';
          const context = label.getContext('2d');
          context.font = font;
          label.width = Math.ceil(context.measureText(name).width) + 10;
          label.height = 21;
          context.font = font;
          context.textBaseline = 'middle';
          context.fillStyle = '#182b55e8';
          context.fillRect(0,0,label.width,label.height);
          context.fillStyle = '#0c1631';
          context.fillRect(0,label.height-2,label.width,2);
          context.fillText(name,6,12);
          context.fillStyle = '#fff7ed';
          context.fillText(name,5,11);
          const x = label.width * .0045, y = label.height * .0045;
          const vertices = [
            [-x,-y,0,0,0], [x,-y,0,1,0], [x,y,0,1,1],
            [-x,-y,0,0,0], [x,y,0,1,1], [-x,y,0,0,1]
          ].flatMap(corner => [...corner,1,1,1,1,1]);
          this.nameplate = {name,halfWidth:x,halfHeight:y,mesh:this.mesh(vertices),texture:this.texture(label)};
        }

        draw(options) {
          this.nameplateYaw = options.yaw + .17;
          super.draw({...options,zoom:options.zoom * .79});
        }

        drawPlayer(dance,time) {
          const label = this.nameplate;
          if (!label) return super.drawPlayer(dance,time);
          const c = Math.cos(this.nameplateYaw), s = Math.sin(this.nameplateYaw);
          const y = -1.98, z = .06;
          const pose = [c,0,s,0, 0,1,0,0, -s,0,c,0, 0,y,z,1];
          const view = this.view;
          const labelTop = Math.abs(view[1]*c + view[9]*s)*label.halfWidth
            + Math.abs(view[5])*label.halfHeight + view[5]*y + view[9]*z + view[13];
          // The canvas is raised within the scene. Keep the name in its visible area when zooming.
          view[13] -= Math.max(0,labelTop-.83);
          const head = super.drawPlayer(dance,time);
          this.drawMesh(label.mesh,label.texture,pose,true);
          return head;
        }
      }

      try { homeView = new HomeAvatar(homeCanvas); }
      catch (error) { console.warn('Using the CSS model for the launcher preview',error); }

      const title = stage.querySelector('#play-heading');
      const defaultName = title.textContent;
      function updateNameplate() {
        const name = profileName.textContent.trim() || defaultName;
        title.textContent = name;
        skinModel.dataset.playerName = name;
        homeView?.setName(name);
        queueCosmeticFrame();
      }
      updateNameplate();
      new MutationObserver(updateNameplate).observe(profileName,{childList:true});
      updateCosmeticPreviews();

      launchColumn.classList.add('concept-launch');
      const copy = document.createElement('span');
      copy.append($('launch-label'),launchColumn.querySelector('.profile-spec'));
      $('launch').append(copy);
      $('quick-settings').remove();

      const picker = $('concept-versions');
      picker.querySelector('.concept-version-options').append(...versions);
      const versionButton = document.createElement('button');
      versionButton.type = 'button';
      versionButton.className = 'button profile-button';
      versionButton.setAttribute('aria-haspopup','dialog');
      versionButton.setAttribute('aria-controls',picker.id);
      versionButton.setAttribute('aria-label','Выбрать версию Minecraft');
      versionButton.title = 'Выбрать версию Minecraft';
      versionButton.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-profiles"/></svg>';
      launchActions.append(versionButton);
      versionButton.addEventListener('click',() => {
        picker.showModal();
        picker.querySelector('[aria-pressed="true"]')?.focus();
      });
      picker.addEventListener('click',event => {
        if (event.target.closest('.version-tile')) picker.close();
      });
      picker.addEventListener('close',() => versionButton.focus());

      const feedback = document.createElement('p');
      feedback.className = 'concept-launch-status';
      feedback.setAttribute('role','status');
      launchColumn.append(feedback);
      $('launch').addEventListener('click',() => {
        feedback.textContent = 'Запуск доступен в приложении Gleam Launcher';
      });
      for (const button of board.querySelectorAll('[data-concept-server]')) {
        const address = button.dataset.conceptServer;
        button.title = address;
        button.addEventListener('click',() => {
          feedback.textContent = playableVersions.has(selectedVersion)
            ? 'Подключение к ' + address + ' доступно в приложении'
            : 'Выбери поддерживаемую версию Minecraft';
          if (playableVersions.has(selectedVersion)) void launchGame(null,button,null,address);
        });
      }
      for (const tile of versionTiles) tile.addEventListener('click',() => { feedback.textContent = ''; });

      news.classList.add('concept-panel','concept-news');
      const cover = document.createElement('button');
      cover.type = 'button';
      cover.className = 'concept-news-art';
      const topStory = news.querySelector('.news-entry');
      cover.setAttribute('aria-label',topStory.querySelector('strong').textContent);
      cover.addEventListener('click',() => topStory.click());
      news.querySelector('header').after(cover);
      news.querySelector('#news-shortcut').replaceChildren('Все новости');
      board.querySelector('.concept-rail').append(news);

      const friends = [
        ['SoraFox','В своём мире','#b65d36','#f2b088','#2b5851'],
        ['NoxCraft','В игре','#242941','#bd8b71','#749cc9'],
        ['MiraSky','В лаунчере','#7b496b','#e6a783','#d7b6e4','away'],
        ['Frostbyte','','#243d56','#dcad94','#76a2a3','offline'],
        ['PixelPanda','','#323845','#eed9ce','#8098cb','offline']
      ];
      const people = $('concept-people');
      const openFriends = () => {
        navigate('friends');
        $('friends-heading').focus({preventScroll:true});
      };
      $('concept-open-friends').addEventListener('click',openFriends);
      for (const [index,[name,status,hair,skin,eyes,presence]] of friends.entries()) {
        if (index && presence === 'offline' && friends[index-1].at(-1) !== 'offline') {
          const label = document.createElement('li');
          label.className = 'concept-offline';
          label.textContent = 'Не в сети';
          people.append(label);
        }
        const item = document.createElement('li');
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'concept-person';
        if (presence) row.toggleAttribute('data-'+presence,true);
        const face = document.createElement('span');
        face.className = 'concept-face';
        face.setAttribute('aria-hidden','true');
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 8;
        const pixel = canvas.getContext('2d');
        pixel.fillStyle = hair;
        pixel.fillRect(0,0,8,8);
        pixel.fillStyle = skin;
        pixel.fillRect(1,2+index%2,6,6-index%2);
        pixel.fillStyle = eyes;
        pixel.fillRect(2,4,1,1);
        pixel.fillRect(5,4,1,1);
        pixel.fillStyle = hair;
        pixel.fillRect(index%2 ? 3 : 1,2,index%2 ? 3 : 2,1);
        pixel.fillRect(3,6,2,1);
        face.append(canvas);
        const person = document.createElement('span');
        person.className = 'concept-person-copy';
        const nick = document.createElement('strong');
        nick.textContent = name;
        person.append(nick);
        if (status) {
          const detail = document.createElement('small');
          detail.textContent = status;
          person.append(detail);
        }
        row.append(face,person);
        row.addEventListener('click',openFriends);
        item.append(row);
        people.append(item);
      }
    })();
  </script>
  <script>
    (async () => {
      try {
        const source = await fetch('launcher-preview.html');
        if (!source.ok) throw new Error('HTTP ' + source.status);
        const markup = await source.text();
        const css = document.getElementById('home-css').textContent;
        const layout = document.getElementById('home-layout').outerHTML;
        const script = document.getElementById('home-script').textContent;
        // The native launcher restores its session after the splash. This browser preview has no native session.
        const page = markup
          .replace(/\r?\n    showGleamLogin\('restore'\);(?=\r?\n    showStartup\()/,'')
          .replace('      return restoreGleamLogin();','      return undefined;')
          .replace('if (wings || halo || hat || pet || headwear) {','if (homeView || wings || halo || hat || pet || headwear) {')
          .replace('</head>', () => '<style>' + css + '</style></head>')
          .replace('</body>', () => layout + '<script>' + script + '<' + '/script></body>');
        document.open();
        document.write(page);
        document.close();
      } catch (error) {
        document.getElementById('preview-loading').textContent = 'Запусти локальный сервер, чтобы открыть превью Gleam Launcher';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
