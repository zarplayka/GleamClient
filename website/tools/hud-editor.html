<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GleamClient · Редактор HUD</title><link rel="icon" href="../assets/orion-badge.png"><link rel="stylesheet" href="hud-editor.css">
</head><body><div id="hud-editor">
<header aria-label="Редактор HUD">
  <div class="dock">
    <div class="seg" aria-label="Позиционирование"><button id="snap">Сетка</button><button id="free">Свободно</button></div>
    <button id="library" aria-label="Виджеты" title="Виджеты" aria-controls="panel" aria-expanded="false">+</button>
    <details id="layout">
      <summary title="Настройки раскладки" aria-label="Настройки раскладки">⋯</summary>
      <div class="layout-options">
        <label>Шаг сетки <select id="step"><option>8</option><option>16</option><option>24</option><option>32</option></select> px</label>
        <button id="arrange" title="Вернуть виджеты на исходные места">Разложить</button>
      </div>
    </details>
  </div>
  <button id="preview" aria-pressed="false">Просмотр</button>
</header>
<main id="stage"><div class="grid"></div><div id="layers"></div>
<div id="alignment" aria-hidden="true" hidden>
  <span id="guide-x" hidden></span>
  <span id="guide-y" hidden></span>
</div>
<aside id="panel" hidden></aside>
</main>
<footer>
  <span class="hint"><kbd>Alt</kbd> перемещение без привязки</span>
  <span id="saved" role="status"></span>
</footer>
</div><script src="hud-editor.js"></script></body></html>
