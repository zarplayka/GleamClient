<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Миры и серверы · GleamClient</title>
  <link rel="stylesheet" href="gleam-servers.css">
  <style>
    @font-face {
      font-family: Onest;
      src: url('../assets/onest-regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: Onest;
      src: url('../assets/onest-bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }

    @property --accent {
      syntax: '<color>';
      inherits: true;
      initial-value: #ffc095;
    }

    :root {
      color-scheme: dark;
      /* Palette shared with the three ClickGUI themes. */
      --frame: #18191c;
      --canvas: #1d1e22;
      --card: #25262a;
      --field: #202125;
      --hover: #303136;
      --rule: #3b3c41;
      --line: #313237;
      --ink: #e5e5e7;
      --muted: #b0b1b6;
      --accent: #939fe9;
      --accent-surface: #363b4d;
      --bar-fill: var(--frame);
      --rail-fill: var(--canvas);
      --panel-fill: var(--card);
      --panel-border: var(--rule);
      --panel-blur: none;
      --panel-shadow: 0 9px 24px #0a0c142e;
      --dialog-blur: none;
      --dialog-backdrop: #0b0d19b5;
      --play-fill: #e5e5e7;
      --play-hover: #fff;
      --play-text: #16182a;
      --scene-text: #f8f8fc;
      --scene-muted: #e1e4ee;
      --scene-shadow: 0 2px 16px #05070faa;
      --scene-accent: #ffc095;
      --scene-light: color-mix(in srgb, var(--scene-accent) 21%, transparent);
      --online: #9ce6c1;
      --offline: #ffaea7;
      --maintenance: #f6cd91;
      --ease: cubic-bezier(.2,.78,.24,1);
      --edge: clamp(23px, 3.5vw, 68px);
      --rail: clamp(76px, 6.2vw, 116px);
      --control: 48px;
      transition: --accent .72s var(--ease);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --frame: #e7eaf1;
      --canvas: #f3f5f9;
      --card: #fafbfe;
      --field: #e2e7f0;
      --hover: #edf0f9;
      --rule: #c4ccda;
      --line: #d6dce7;
      --ink: #22283a;
      --muted: #546077;
      --accent: #4257b2;
      --accent-surface: #dce3fc;
      --dialog-backdrop: #24334c86;
      --play-fill: #4257b2;
      --play-hover: #344795;
      --play-text: #fff;
      --scene-text: var(--ink);
      --scene-muted: #39465c;
      --scene-shadow: 0 2px 12px #f3f5f990;
      --online: #156542;
      --offline: #a52d3e;
      --maintenance: #795019;
    }

    :root[data-theme="glass"] {
      --frame: #1b252d;
      --card: #11181e38;
      --field: #10192156;
      --hover: #eff7ff26;
      --rule: #edf4fa29;
      --line: #edf4fa20;
      --ink: #fff;
      --muted: #eff4f8;
      --accent: var(--scene-accent);
      --accent-surface: #5274996b;
      --bar-fill: linear-gradient(180deg, #1115204d, #11152015);
      --rail-fill: linear-gradient(180deg, #141827bf, #11152240 59%, #111522b3);
      --panel-fill: radial-gradient(ellipse at 15% 0%, var(--scene-light), transparent 60%), linear-gradient(145deg, #2a30419c, #0f131fcc);
      --panel-blur: blur(20px) saturate(135%);
      --panel-shadow: inset 0 1px #f3f8ff1c, 0 14px 35px #0609143d;
      --dialog-blur: blur(8px);
      --play-fill: linear-gradient(180deg, #fff, #e4e8f1);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-width: 760px;
      background: var(--canvas);
      color: var(--ink);
      font: 15px/1.46 Onest, system-ui, sans-serif;
    }

    button {
      color: inherit;
      font: inherit;
      cursor: pointer;
      border: 0;
      background: none;
    }

    button:disabled { opacity: .33; cursor: default; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    svg {
      width: 21px;
      height: 21px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }

    .wallpaper {
      position: fixed;
      inset: 0;
      isolation: isolate;
      overflow: hidden;
      pointer-events: none;
      background: var(--canvas);
    }

    .panorama {
      position: absolute;
      inset: -2%;
      isolation: isolate;
      animation: camera-drift 26s ease-in-out infinite alternate;
    }

    .panorama img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--position, center);
      filter: saturate(.88);
      opacity: 0;
      transform: scale(1.07);
      transition: opacity .76s var(--ease), transform 1.55s var(--ease);
    }

    .panorama img.active { z-index: 1; opacity: 1; transform: scale(1); }

    @keyframes camera-drift {
      from { transform: translate3d(.45%, -.15%, 0); }
      to { transform: translate3d(-.55%, .45%, 0) scale(1.032); }
    }

    .scrim, .atmosphere, .motes { position: absolute; inset: 0; }

    .scrim {
      background:
        linear-gradient(0deg, #090c15 1%, rgba(9,12,21,.95) 13%, rgba(9,12,21,.77) 25%, rgba(9,12,21,.19) 49%, transparent 64%),
        linear-gradient(90deg, rgba(8,11,18,.71), rgba(8,11,18,.54) 22%, transparent 67%, rgba(8,11,18,.17)),
        linear-gradient(180deg, rgba(9,12,21,.92), rgba(9,12,21,.66) 14%, rgba(9,12,21,.21) 30%, transparent 42%);
    }

    html[data-theme="light"] .scrim {
      background:
        linear-gradient(0deg, #f3f5f9 3%, #f3f5f9f7 15%, #f3f5f9d4 34%, transparent 59%),
        linear-gradient(90deg, #e7eaf19c, #e7eaf166 27%, transparent 61%),
        linear-gradient(180deg, #e7eaf1fa, #f3f5f995 14%, transparent 35%);
    }

    .atmosphere {
      background: radial-gradient(ellipse at 84% 59%, var(--scene-light), transparent 59%);
      mix-blend-mode: screen;
    }

    html:not([data-theme="glass"]) :is(.atmosphere, .motes) { display: none; }

    .motes i {
      position: absolute;
      top: var(--y);
      left: var(--x);
      width: var(--size);
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      box-shadow: 0 0 10px var(--accent);
      animation: float-mote var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes float-mote {
      35%, 65% { opacity: .58; }
      to { opacity: 0; transform: translate3d(39px, -124px, 0); }
    }

    .surface {
      border: 1px solid var(--panel-border);
      background: var(--panel-fill);
      backdrop-filter: var(--panel-blur);
      box-shadow: var(--panel-shadow);
    }

    .dashboard {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-columns: var(--rail) minmax(0, 1fr);
      grid-template-rows: 79px 1fr 58px;
    }

    .top {
      grid-column: 1 / -1;
      display: grid;
      align-items: center;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      padding: 0 var(--edge) 0 25px;
      border-bottom: 1px solid var(--line);
      background: var(--bar-fill);
    }

    .brand, .top-actions { display: flex; align-items: center; gap: 13px; }

    .brand {
      width: max-content;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -.065em;
    }

    .brand img { width: 34px; height: 27px; object-fit: contain; }
    .brand-suffix { color: var(--muted); font-weight: 400; }
    html[data-theme="light"] :is(.brand img, .launch-mark) { filter: brightness(.3); }
    .top-actions { justify-self: end; }

    .preview-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .preview-tag::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    .icon-button {
      display: grid;
      flex: none;
      place-items: center;
      width: var(--control);
      height: var(--control);
      border-radius: 50%;
      transition: background .25s, color .25s, transform .25s var(--ease);
    }

    .icon-button:not(:disabled):hover { background: var(--hover); transform: translateY(-2px); }
    .icon-button:not(:disabled):active { transform: scale(.94); }
    .top .icon-button { --control: 39px; }
    .top .icon-button svg { width: 18px; height: 18px; }

    #preview-theme {
      min-height: 34px;
      max-width: 106px;
      padding: 0 9px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      color: var(--ink);
      background: var(--field);
      font: inherit;
      font-size: 12px;
    }

    #preview-theme option { color: var(--ink); background: var(--frame); }

    .rail {
      grid-column: 1;
      grid-row: 2 / 4;
      display: flex;
      align-items: stretch;
      flex-direction: column;
      padding: 24px 8px 12px;
      gap: 6px;
      border-right: 1px solid var(--line);
      background: var(--rail-fill);
    }

    .rail-button {
      position: relative;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 6px;
      min-height: 62px;
      border: 1px solid transparent;
      border-radius: 13px;
      padding: 5px 1px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1;
      transition: color .25s, background .25s, border-color .25s;
    }

    .rail-button:hover { color: var(--ink); background: var(--hover); }

    .rail-button[aria-pressed="true"] {
      color: var(--ink);
      background: var(--accent-surface);
      border-color: var(--rule);
    }

    .rail-button[aria-pressed="true"]::before {
      content: '';
      position: absolute;
      left: -9px;
      top: 16px;
      bottom: 16px;
      width: 2px;
      border-radius: 8px;
      background: var(--accent);
    }

    #controls { margin-top: auto; }

    main {
      grid-column: 2;
      grid-row: 2;
      min-width: 0;
      min-height: 595px;
      display: flex;
      flex-direction: column;
      gap: clamp(153px, 24vh, 288px);
      padding: 18px var(--edge) clamp(22px, 4.6vh, 55px);
    }

    .library { min-width: 0; }

    .library-head, .shelf-controls, .arrows {
      display: flex;
      align-items: center;
    }

    .library-head {
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 6px;
    }

    .library-head h2 {
      margin: 0;
      color: var(--scene-text);
      font-size: clamp(22px, 1.88vw, 33px);
      letter-spacing: -.047em;
      line-height: 1.1;
    }

    .shelf-controls { gap: 14px; }
    .arrows { gap: 3px; }
    .arrows .icon-button { --control: 34px; background: var(--field); }
    .arrows svg { width: 17px; height: 17px; }

    .count {
      color: var(--scene-muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .055em;
    }

    .shelf {
      display: flex;
      gap: 16px;
      margin: 0 -14px;
      padding: 15px 14px 14px;
      overflow: auto hidden;
      scrollbar-width: none;
      overscroll-behavior-inline: contain;
    }

    .shelf::-webkit-scrollbar { display: none; }

    .tile {
      position: relative;
      isolation: isolate;
      display: flex;
      flex: 0 0 clamp(148px, 13.35vw, 242px);
      aspect-ratio: 1.76;
      align-items: end;
      overflow: hidden;
      padding: 12px 13px;
      border: 1px solid var(--rule);
      border-radius: 12px;
      background: #151a24;
      color: #f8f8fc;
      text-align: left;
      box-shadow: 0 9px 20px #02040c52;
      transition: border-color .24s, box-shadow .3s var(--ease), transform .32s var(--ease);
    }

    .tile img {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--position, center);
      filter: saturate(.84) brightness(.78);
      transition: transform .55s var(--ease), filter .38s;
    }

    .tile::before, .tile::after { content: ''; position: absolute; inset: 0; z-index: -1; }

    .tile::before {
      background: linear-gradient(0deg, #0b0d18 0%, #0c0e19cf 17%, #0c0e1935 57%, transparent 75%);
    }

    .tile::after {
      background: linear-gradient(155deg, #ffffff50, transparent 39%);
      opacity: .16;
      transition: opacity .32s var(--ease);
    }

    .tile:hover { transform: translateY(-3px); border-color: #e0e4eda8; }
    html[data-theme="glass"] .tile:is(:hover, [aria-current="true"])::after { opacity: .75; }
    html:not([data-theme="glass"]) .tile::after { display: none; }

    .tile[aria-current="true"] {
      transform: translateY(-3px) scale(1.09);
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent), 0 12px 22px #03050f6e;
    }

    .tile:focus-visible { outline-offset: 1px; }
    .tile:hover img, .tile[aria-current="true"] img { transform: scale(1.045); filter: none; }

    .tile-name {
      overflow: hidden;
      font-size: clamp(12px, 1.03vw, 16px);
      font-weight: 700;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tile-mode { display: block; margin-top: 4px; color: #d6dbe6; font-size: 10px; font-weight: 400; }

    .tile-star {
      position: absolute;
      top: 8px;
      right: 8px;
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: var(--field);
      color: var(--accent);
      backdrop-filter: var(--panel-blur);
    }

    .tile-star svg { width: 12px; height: 12px; fill: currentColor; }

    .empty {
      width: min(100%, 400px);
      margin-top: 8px;
      padding: 18px 21px;
      border-radius: 16px;
    }

    .empty p { margin: 0 0 9px; color: var(--muted); }

    .text-button {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      color: var(--accent);
      font-weight: 700;
    }

    .text-button:hover { text-decoration: underline; }
    .text-button svg { width: 15px; height: 15px; }

    .feature {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(218px, 20vw, 310px);
      gap: 35px;
      align-items: end;
      margin-top: auto;
    }

    .world-copy { min-width: 0; }

    .world-type {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--scene-muted);
      font-size: 13px;
    }

    #world-mode {
      padding: 3px 9px;
      border: 1px solid color-mix(in srgb, var(--accent) 63%, transparent);
      border-radius: 5px;
      background: var(--field);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .03em;
    }

    h1 {
      margin: 9px 0 11px;
      font-size: clamp(40px, 5.8vw, 104px);
      line-height: 1.025;
      letter-spacing: -.062em;
      text-wrap: balance;
      color: var(--scene-text);
      text-shadow: var(--scene-shadow);
    }

    .description {
      max-width: 51ch;
      margin: 0;
      color: var(--scene-muted);
      font-size: clamp(14px, 1.18vw, 18px);
      text-wrap: pretty;
    }

    .actions { display: flex; align-items: center; gap: 12px; margin-top: 23px; }

    .play {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-width: 222px;
      min-height: 56px;
      padding: 0 25px;
      border: 1px solid transparent;
      border-radius: 100px;
      color: var(--play-text);
      background: var(--play-fill);
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 8px 33px #06091161;
      transition: transform .25s var(--ease), box-shadow .25s, background .25s;
    }

    .play svg { width: 16px; height: 16px; fill: currentColor; stroke-width: 1; }
    .play:hover { background: var(--play-hover); transform: translateY(-2px); }
    .play:active { transform: scale(.96); }
    .actions .icon-button { --control: 54px; }
    .favorite[aria-pressed="true"] { color: var(--accent); }
    .favorite[aria-pressed="true"] svg { fill: currentColor; }

    .world-record { padding: 17px 19px 9px; border-radius: 19px; }
    .world-record h2 { display: flex; align-items: center; gap: 9px; margin: 0 0 7px; font-size: 14px; }
    .world-record svg { width: 17px; height: 17px; color: var(--accent); }
    .stats { margin: 0; }

    .stats div {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      font-size: 12px;
    }

    .stats div + div { border-top: 1px solid var(--line); }
    .stats dt { color: var(--muted); }
    .stats dd { margin: 0; font-weight: 700; white-space: nowrap; }

    .footer {
      grid-column: 2;
      grid-row: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 var(--edge);
      border-top: 1px solid var(--line);
      background: var(--bar-fill);
      color: var(--muted);
      font-size: 12px;
    }

    .hints, .hint { display: flex; align-items: center; gap: 7px; }
    .hints { gap: 19px; }

    kbd {
      display: inline-grid;
      place-items: center;
      min-width: 22px;
      height: 23px;
      padding: 0 6px;
      border: 1px solid var(--rule);
      border-radius: 6px;
      background: var(--field);
      color: var(--ink);
      font: inherit;
      font-size: 11px;
    }

    dialog {
      width: min(460px, calc(100% - 34px));
      margin: auto;
      padding: 27px;
      border-radius: 23px;
      color: var(--ink);
      overflow: auto;
    }

    dialog::backdrop { background: var(--dialog-backdrop); backdrop-filter: var(--dialog-blur); }
    dialog[open] { animation: reveal-dialog .38s var(--ease) both; }
    dialog h2 { margin: 0 40px 9px 0; font-size: 29px; line-height: 1.13; letter-spacing: -.055em; }
    dialog p { margin: 0 0 18px; color: var(--muted); }
    dialog .close { position: absolute; top: 15px; right: 15px; }

    @keyframes reveal-dialog {
      from { opacity: 0; transform: translateY(12px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .launch {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      padding: 24px;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: var(--canvas);
      text-align: center;
    }

    .launch[open] { display: grid; place-items: center; animation-name: reveal-launch; }
    @keyframes reveal-launch { from { opacity: 0; } to { opacity: 1; } }

    .launch > img, .launch::before {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--position, center);
      pointer-events: none;
    }

    .launch > img { animation: launch-push 4s var(--ease) both; }
    @keyframes launch-push { to { transform: scale(1.1); } }

    .launch::before {
      content: '';
      z-index: 1;
      background: radial-gradient(ellipse at 50% 47%, #070b1763, #090d16df 85%);
    }

    html[data-theme="light"] .launch::before {
      background: radial-gradient(ellipse at 50% 47%, #f3f5f9eb 7%, #f3f5f9b3 48%, #e7eaf199 85%);
    }

    .launch-content {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 13px;
      width: min(680px, 100%);
    }

    .launch-mark { width: 47px; margin-bottom: 2px; }
    .launch-content h2 { margin: 0; font-size: clamp(36px, 7vw, 85px); }
    .launch-content p { margin: 0; color: var(--scene-muted); }
    .launch-content .play { min-width: 142px; min-height: 43px; margin-top: 8px; font-size: 13px; }

    progress {
      width: min(300px, 87%);
      height: 4px;
      margin: 9px 0;
      accent-color: var(--accent);
    }

    @media (max-height: 770px) {
      .dashboard { grid-template-rows: 63px 1fr 48px; }
      main { min-height: 0; gap: 17vh; padding-top: 12px; padding-bottom: 19px; }
      h1 { font-size: clamp(40px, 5.4vw, 85px); }
      .actions { margin-top: 17px; }
    }

    @media (max-width: 1000px) {
      .top { padding-inline: 16px var(--edge); }
      .top-actions { gap: 8px; }
      .feature { gap: 22px; }
      .actions .play { min-width: 160px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

  <script src="gleam-servers.js"></script>
  <script>
    'use strict';

    const worlds = [
      { id: 'ember', name: 'Пепельный рубеж', biome: 'Нижний мир', mode: 'Хардкор', image: 'launcher-background-1-16-5.webp', position: '53% 61%', accent: '#ffc095', played: '3 ч 58 мин', date: '20 ноября', version: '26.3', description: 'Лавовые реки и руины бастиона. Последний безопасный путь к порталу помечен фонарями.' },
      { id: 'valley', name: 'Долина порталов', biome: 'Горная долина', mode: 'Выживание', image: '../assets/auth-portal.jpg', position: '50% 50%', accent: '#acd3ff', played: '18 ч 42 мин', date: '23 ноября', version: '26.3', description: 'Тихая долина между горами. У подножия скал остался портал, который так и не успели достроить.' },
      { id: 'cherry', name: 'Вишнёвый край', biome: 'Вишнёвая роща', mode: 'Творчество', image: 'launcher-background-26-1-2.webp', position: '60% 48%', accent: '#ffbbdc', played: '7 ч 16 мин', date: '21 ноября', version: '26.3', description: 'Сад на склоне, мост через ущелье и целый холм для следующей постройки.' },
      { id: 'wild', name: 'Дикий берег', biome: 'Берег джунглей', mode: 'Выживание', image: '../assets/auth-wild.jpg', position: '65% 50%', accent: '#acf1cf', played: '12 ч 24 мин', date: '17 ноября', version: '1.21.11', description: 'Из лагеря на берегу видно устье реки. Дальше начинаются джунгли, где ещё никто не ставил факелы.' },
      { id: 'fortress', name: 'Чёрная цитадель', biome: 'Базальтовые дельты', mode: 'Выживание', image: 'launcher-background-1-21-4.webp', position: '62% 50%', accent: '#f3c6a8', played: '5 ч 11 мин', date: '14 ноября', version: '1.21.4', description: 'Крепость из чернита, спрятанная в дыму. Самые старые галереи уходят глубоко под её стены.' },
      { id: 'workshop', name: 'Мастерская', biome: 'Равнины', mode: 'Творчество', image: 'launcher-background-26-2.webp', position: '62% 50%', accent: '#f3daae', played: '9 ч 37 мин', date: '11 ноября', version: '26.2', description: 'Песочница для редстоуна, странных машин и построек, которые сначала хочется увидеть в масштабе.' }
    ];

    const byId = id => document.getElementById(id);
    const shelf = byId('shelf');
    const panel = byId('info-panel');
    const launch = byId('launch');
    const favorite = byId('favorite');
    const filterButtons = [...document.querySelectorAll('[data-filter]')];
    const modeButtons = [...document.querySelectorAll('[data-mode]')];
    const serverFilterButtons = [...document.querySelectorAll('[data-server-filter]')];
    const serverEditor = byId('server-editor');
    const layers = [...document.querySelectorAll('.wallpaper img')];
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const sections = { all: 'Мои миры', recent: 'Недавние', favorites: 'Избранное' };
    const formatPosition = number => String(number).padStart(2, '0');
    const previews = new Map();
    const storageKey = 'gleam-worlds-preview-favorites';
    let favorites = new Set(['cherry']);
    let recents = ['valley', 'cherry', 'ember'];
    let filter = 'all';
    let visible = worlds;
    let selected = worlds[0];
    let lastInLibrary = selected;
    let activeLayer = 1;
    let wallpaperRequest = 0;
    let launchFrame = 0;
    let mode = 'solo';
    const network = createServerBrowser({ byId, showScene, launchScene, reducedMotion });

    const themeControl = byId('preview-theme');
    const themeKey = 'gleam-worlds-preview-theme';
    try {
      const theme = localStorage.getItem(themeKey);
      if ([...themeControl.options].some(option => option.value === theme)) {
        themeControl.value = theme;
        document.documentElement.dataset.theme = theme;
      }
    } catch { /* The theme can still be changed for this session. */ }
    themeControl.addEventListener('change', () => {
      const theme = themeControl.value;
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem(themeKey, theme); } catch { /* Storage is optional. */ }
    });

    try {
      const stored = JSON.parse(localStorage.getItem(storageKey));
      if (Array.isArray(stored)) favorites = new Set(stored.filter(id => worlds.some(world => world.id === id)));
    } catch { /* The preview also works without storage. */ }

    function statsMarkup(world) {
      return `<div><dt>Последняя игра</dt><dd>${world.date}</dd></div>
              <div><dt>Время в мире</dt><dd>${world.played}</dd></div>
              <div><dt>Версия</dt><dd>${world.version}</dd></div>`;
    }

    function imageFor(world) {
      if (!previews.has(world.id)) {
        const image = new Image();
        image.src = world.image;
        previews.set(world.id, image);
      }
      return previews.get(world.id);
    }

    async function changeWallpaper(world) {
      const request = ++wallpaperRequest;
      if (!world || layers[activeLayer].dataset.world === world.id) return;
      const source = imageFor(world);
      try { await source.decode(); } catch { return; }
      if (request !== wallpaperRequest) return;
      const previous = layers[activeLayer];
      activeLayer = 1 - activeLayer;
      const incoming = layers[activeLayer];
      incoming.src = source.src;
      incoming.dataset.world = world.id;
      incoming.style.setProperty('--position', world.position);
      incoming.classList.add('active');
      previous.classList.remove('active');
    }

    function showScene(scene) {
      document.documentElement.style.setProperty('--scene-accent', scene.accent);
      changeWallpaper(scene);
    }

    function paintSelection(animate) {
      const index = visible.indexOf(selected);
      byId('previous').disabled = index <= 0;
      byId('next').disabled = index < 0 || index >= visible.length - 1;
      byId('count').textContent = `${formatPosition(index + 1)} / ${formatPosition(visible.length)}`;
      byId('feature').hidden = !selected;
      shelf.hidden = !selected;
      if (!selected) return;

      byId('world-name').textContent = selected.name;
      byId('world-mode').textContent = selected.mode;
      byId('world-biome').textContent = selected.biome;
      byId('description').textContent = selected.description;
      byId('stats').innerHTML = statsMarkup(selected);
      favorite.setAttribute('aria-pressed', favorites.has(selected.id));
      showScene(selected);

      if (animate && !reducedMotion.matches) {
        const identity = byId('world-identity');
        identity.getAnimations().forEach(animation => animation.cancel());
        identity.animate(
          [{ opacity: .17, transform: 'translateY(13px)' }, { opacity: 1, transform: 'translateY(0)' }],
          { duration: 425, easing: 'cubic-bezier(.2,.78,.24,1)' }
        );
      }

      for (const [number, tile] of [...shelf.children].entries()) {
        tile.setAttribute('aria-current', number === index);
        tile.tabIndex = number === index ? 0 : -1;
        tile.querySelector('.tile-star').hidden = !favorites.has(visible[number].id);
      }
    }

    function renderShelf() {
      const sorted = recents.map(id => worlds.find(world => world.id === id));
      visible = filter === 'recent' ? sorted : worlds.filter(world => filter === 'all' || favorites.has(world.id));
      if (!visible.includes(selected)) selected = visible[0] || null;
      for (const button of filterButtons) button.setAttribute('aria-pressed', button.dataset.filter === filter);
      byId('section-name').textContent = sections[filter];
      byId('empty').hidden = visible.length > 0;
      shelf.replaceChildren(...visible.map(world => {
        const tile = document.createElement('button');
        tile.className = 'tile';
        tile.dataset.world = world.id;
        tile.style.setProperty('--position', world.position);
        tile.innerHTML = `<img src="${world.image}" alt=""><span class="tile-name">${world.name}<span class="tile-mode">${world.mode}</span></span>
                          <span class="tile-star" aria-hidden="true" hidden><svg><use href="#star"/></svg></span>`;
        return tile;
      }));
      paintSelection(false);
      scrollToSelected(false);
    }

    function scrollToSelected(smooth) {
      const tile = shelf.querySelector('[aria-current="true"]');
      if (!tile) return;
      const railRect = shelf.getBoundingClientRect();
      const tileRect = tile.getBoundingClientRect();
      const inset = 6;
      const left = tileRect.left - railRect.left - inset;
      const right = tileRect.right - railRect.right + inset;
      const offset = left < 0 ? left : Math.max(right, 0);
      if (offset) shelf.scrollBy({ left: offset, behavior: smooth && !reducedMotion.matches ? 'smooth' : 'instant' });
    }

    function select(index, focus = false) {
      const world = visible[index];
      if (!world) return;
      const animate = selected !== world;
      selected = world;
      paintSelection(animate);
      if (focus) shelf.children[index]?.focus({ preventScroll: true });
      scrollToSelected(true);
    }

    function step(delta, focus) {
      select(visible.indexOf(selected) + delta, focus);
    }

    function setFilter(next) {
      if (next === filter) return;
      if (filter === 'all') lastInLibrary = selected;
      filter = next;
      selected = next === 'all' ? lastInLibrary : null;
      renderShelf();
    }

    function openPanel(title, body, world = null) {
      byId('panel-title').textContent = title;
      byId('panel-text').textContent = body;
      byId('panel-stats').hidden = !world;
      if (world) byId('panel-stats').innerHTML = statsMarkup(world);
      panel.showModal();
    }

    function playWorld() {
      if (!selected) return;
      const world = selected;
      launchScene(world, {
        title: world.name,
        message: 'Подготовка мира…',
        result: 'Демонстрационный запуск завершён',
        onFinish: () => { recents = [world.id, ...recents.filter(id => id !== world.id)]; }
      });
    }

    function launchScene(scene, { title, address, message, result, onFinish }) {
      if (launch.open || panel.open || serverEditor.open) return;
      cancelAnimationFrame(launchFrame);
      launch.querySelector('img').src = imageFor(scene).src;
      launch.style.setProperty('--position', scene.position);
      byId('launch-title').textContent = title;
      byId('launch-address').hidden = !address;
      byId('launch-address').textContent = address || '';
      const status = byId('launch-status');
      const progress = byId('progress');
      const back = byId('launch-back');
      status.textContent = message;
      progress.value = 0;
      back.textContent = 'Отмена';
      launch.showModal();
      const start = performance.now();
      const duration = reducedMotion.matches ? 300 : 1450;

      function update(now) {
        if (!launch.open) return;
        progress.value = Math.min((now - start) / duration, 1) * 100;
        if (progress.value < 100) {
          launchFrame = requestAnimationFrame(update);
          return;
        }
        if (onFinish) onFinish();
        status.textContent = result;
        back.textContent = 'В библиотеку';
      }

      launchFrame = requestAnimationFrame(update);
    }

    function setMode(next, focus = false) {
      if (next === mode) return;
      mode = next;
      const multiplayer = mode === 'network';
      document.body.dataset.mode = mode;
      byId('solo').hidden = multiplayer;
      byId('network').hidden = !multiplayer;
      document.querySelector('.rail').setAttribute('aria-label', multiplayer ? 'Сетевые серверы' : 'Библиотека миров');
      for (const button of filterButtons) button.hidden = multiplayer;
      for (const button of serverFilterButtons) button.hidden = !multiplayer;
      for (const button of modeButtons) {
        button.setAttribute('aria-pressed', button.dataset.mode === mode);
        if (focus && button.dataset.mode === mode) button.focus();
      }
      byId('mode-caption').textContent = multiplayer ? 'Сетевая игра' : 'Одиночная игра';
      byId('key-previous').textContent = multiplayer ? '↑' : '←';
      byId('key-next').textContent = multiplayer ? '↓' : '→';
      byId('pad-previous').textContent = multiplayer ? '▲' : '◀';
      byId('pad-next').textContent = multiplayer ? '▼' : '▶';
      byId('key-action').textContent = byId('pad-action').textContent = multiplayer ? 'Подключиться' : 'Играть';
      if (multiplayer) network.render();
      else if (selected) paintSelection(false);
      else showScene(lastInLibrary);
    }

    for (const button of modeButtons) button.addEventListener('click', () => setMode(button.dataset.mode));
    for (const button of filterButtons) button.addEventListener('click', () => setFilter(button.dataset.filter));
    byId('browse-worlds').addEventListener('click', () => {
      setFilter('all');
      shelf.querySelector('[aria-current="true"]').focus();
    });
    shelf.addEventListener('click', event => {
      const tile = event.target.closest('.tile');
      if (tile) select(visible.findIndex(world => world.id === tile.dataset.world));
    });
    shelf.addEventListener('dblclick', event => {
      if (event.target.closest('.tile')) playWorld();
    });
    byId('previous').addEventListener('click', () => step(-1));
    byId('next').addEventListener('click', () => step(1));
    byId('play-world').addEventListener('click', playWorld);
    byId('details').addEventListener('click', () => openPanel(selected.name, selected.description, selected));
    byId('controls').addEventListener('click', () => openPanel('Управление', mode === 'network'
      ? '↑ и ↓ выбирают сервер. Enter показывает подключение, Esc возвращает назад. На геймпаде используйте крестовину и основную кнопку. Бамперы переключают список и избранное, курки переключают режим игры.'
      : '← и → выбирают мир. Enter запускает демонстрацию, Esc возвращает в коллекцию. На геймпаде используйте крестовину и основную кнопку. Бамперы переключают разделы, правый курок открывает сетевую игру.'));
    favorite.addEventListener('click', () => {
      if (!favorites.delete(selected.id)) favorites.add(selected.id);
      try { localStorage.setItem(storageKey, JSON.stringify([...favorites])); } catch { /* Storage is optional. */ }
      if (filter === 'favorites') {
        renderShelf();
        if (!selected) filterButtons[2].focus();
      } else {
        paintSelection(false);
      }
    });
    launch.addEventListener('close', () => {
      if (launch.open) return;
      cancelAnimationFrame(launchFrame);
      if (mode === 'solo' && filter === 'recent') renderShelf();
    });

    const fullscreen = byId('fullscreen');
    fullscreen.hidden = !document.fullscreenEnabled;
    fullscreen.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch {
        openPanel('Полноэкранный режим', 'Браузер отклонил переход. Попробуйте переключить режим через меню браузера.');
      }
    });
    document.addEventListener('fullscreenchange', () => fullscreen.setAttribute('aria-pressed', Boolean(document.fullscreenElement)));

    function back() {
      if (launch.open) launch.close();
      else if (panel.open) panel.close();
      else if (mode === 'network') {
        if (!network.back()) setMode('solo', true);
      }
      else if (filter !== 'all') {
        setFilter('all');
        filterButtons[0].focus();
      }
    }

    document.addEventListener('keydown', event => {
      if (event.altKey || event.ctrlKey || event.metaKey || launch.open || panel.open || serverEditor.open || event.target === themeControl) return;
      showGamepadHints(false);
      const { key, target } = event;
      const onRail = target.closest?.('.rail');
      if (target.closest?.('.mode-switch') && ['ArrowLeft', 'ArrowRight'].includes(key)) {
        setMode(key === 'ArrowLeft' ? 'solo' : 'network', true);
      } else if (key === 'Escape' && !document.fullscreenElement) {
        back();
      } else if (onRail && ['ArrowUp', 'ArrowDown'].includes(key)) {
        const buttons = [...onRail.querySelectorAll('button:not([hidden])')];
        const next = buttons.indexOf(target) + (key === 'ArrowUp' ? -1 : 1);
        buttons[next]?.focus();
      } else if (mode === 'network') {
        network.onKey(event);
        return;
      } else if (['ArrowLeft', 'ArrowRight'].includes(key)) {
        step(key === 'ArrowLeft' ? -1 : 1, true);
      } else if (['Home', 'End'].includes(key) && target.closest?.('.shelf')) {
        select(key === 'Home' ? 0 : visible.length - 1, true);
      } else if (key === 'Enter' && (target === document.body || target.closest?.('.shelf'))) {
        playWorld();
      } else {
        return;
      }
      event.preventDefault();
    });

    function showGamepadHints(gamepad) {
      byId('keyboard-hints').hidden = gamepad;
      byId('gamepad-hints').hidden = !gamepad;
    }

    function watchGamepad() {
      let pressed = new Set();
      function poll() {
        const controller = Array.from(navigator.getGamepads()).find(pad => pad?.mapping === 'standard');
        if (!controller) {
          showGamepadHints(false);
          return;
        }
        const held = new Set(controller.buttons.flatMap((button, index) => button.pressed ? [index] : []));
        const activated = key => held.has(key) && !pressed.has(key);
        if (held.size) showGamepadHints(true);
        if (activated(1)) back();
        if (!launch.open && !panel.open && !serverEditor.open) {
          if (activated(6)) setMode('solo');
          if (activated(7)) setMode('network');
          if (mode === 'network') {
            if (activated(12)) network.step(-1);
            if (activated(13)) network.step(1);
            if (activated(4)) network.setFilter('all');
            if (activated(5)) network.setFilter('favorites');
            if (activated(0)) network.connect();
          } else {
            if (activated(14)) step(-1, true);
            if (activated(15)) step(1, true);
            const index = filterButtons.findIndex(button => button.dataset.filter === filter);
            if (activated(4) && index > 0) setFilter(filterButtons[index - 1].dataset.filter);
            if (activated(5) && index < filterButtons.length - 1) setFilter(filterButtons[index + 1].dataset.filter);
            if (activated(0)) playWorld();
          }
        }
        pressed = held;
        requestAnimationFrame(poll);
      }
      poll();
    }

    window.addEventListener('gamepadconnected', event => {
      if (event.gamepad.mapping === 'standard' && Array.from(navigator.getGamepads()).filter(pad => pad?.mapping === 'standard').length === 1) watchGamepad();
    });

    if (!reducedMotion.matches) {
      for (let index = 0; index < 18; index++) {
        const mote = document.createElement('i');
        mote.style.setProperty('--x', `${28 + (index * 23) % 69}%`);
        mote.style.setProperty('--y', `${36 + (index * 17) % 52}%`);
        mote.style.setProperty('--size', `${1 + index % 3}px`);
        mote.style.setProperty('--duration', `${7 + index % 6}s`);
        mote.style.setProperty('--delay', `${-index * 1.37}s`);
        byId('motes').append(mote);
      }
    }

    renderShelf();
  </script>
</body>
</html>
