<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" data-hud-theme href="hud-theme.css">
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden}
[hidden]{display:none!important}
.invite{width:354px;margin:7px 3px 0;padding:9px 11px 8px;position:relative;opacity:0}
.main{display:flex;align-items:center;gap:8px}
.face{display:flex;align-items:center;justify-content:center;width:33px;height:33px;flex:none;overflow:hidden;border:1px solid var(--line);border-radius:var(--hud-inner-radius);color:var(--accent);background:var(--well);font-size:13px}
.face img{width:31px;height:31px;object-fit:cover}
.copy{min-width:0;flex:1}
.copy>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title{font-size:13px;font-weight:700;line-height:17px}
#world,#hint{font-size:11px;line-height:14px}
#world{margin-top:2px;color:var(--muted)}
#hint{margin-top:3px;color:var(--accent)}
.hold-key{margin:6px 8px 0 0;width:29px;height:27px;flex:none;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px}
.hold-key span{position:relative}
#fill{position:absolute;bottom:0;left:0;width:100%;height:0;background:var(--accent);opacity:.36}
.dismiss{position:absolute;top:3px;right:4px;color:var(--muted);width:18px;height:18px;display:flex;justify-content:center;align-items:center}
.countdown{margin-top:7px;height:2px;overflow:hidden;border-radius:1px}
#remaining{height:2px;background:var(--accent)}
</style>
</head>
<body class="gleam-hud">
<article class="invite gleam-hud-panel" id="card">
  <div class="main">
    <div class="face"><img id="avatar" alt="" hidden><b id="initial"></b></div>
    <div class="copy"><div id="title"></div><div id="world"></div><div id="hint"></div></div>
    <div class="hold-key gleam-hud-key" id="key"><i id="fill"></i><span>Y</span></div>
  </div>
  <div class="dismiss" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M6 6l12 12M18 6 6 18"/></svg></div>
  <div class="countdown gleam-hud-divider"><div id="remaining"></div></div>
</article>
<script>
const $ = id => document.getElementById(id);
window.paradox = {
  update(state) {
    document.documentElement.toggleAttribute('data-light',state.light);
    for (const key of ['title','world','hint','initial']) $(key).textContent = state[key];
    $('avatar').hidden = !state.avatar;
    $('initial').hidden = !!state.avatar;
    if (state.avatar) {
      const src = 'assets/' + state.avatar + '.png';
      if ($('avatar').getAttribute('src') !== src) $('avatar').setAttribute('src',src);
    }
    $('key').hidden = !state.key;
    $('fill').style.setProperty('height',state.hold * 100 + '%');
    $('remaining').style.setProperty('width',state.remaining * 100 + '%');
    $('card').style.setProperty('opacity',String(state.opacity));
    $('card').style.setProperty('transform','translateY(' + state.offset + 'px)');
  }
};
</script>
</body>
</html>
