<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" data-hud-theme href="hud-theme.css"><style>
html,body{margin:0;padding:0;background:transparent;color:var(--text)}
#hud{position:absolute;left:0;top:0}
.part{position:absolute;box-sizing:border-box}
.label{display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.panel{background:var(--hud-panel)}
html[data-glass] .panel{background:var(--hud-glass)}
.well{background:var(--well);border:1px solid var(--line)}
.divider{background:var(--line)}
.key{display:flex;align-items:center;justify-content:center;gap:3px;padding:0 2px;border-bottom:1px solid #e5eafa66;color:#f7f9ff;text-shadow:0 1px 2px #111421,0 0 3px #111421;line-height:1;transition:background-color .1s,border-color .1s}
.key>strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:8px;font-weight:700}
.key[data-long-label]>strong,.key[data-bar]>strong{font-size:6px}
.key[data-pressed]{border-bottom-color:var(--accent);background:#252d42d8}
.key[data-counter]{justify-content:space-between;padding:0 4px;background:transparent;font-variant-numeric:tabular-nums}
.key[data-counter][data-pressed]{background:#252d42d8}
.key[data-counter]>strong{font-size:7px}
.key .mouse,.key .key-unit{font-size:5px}
@media(prefers-reduced-motion:reduce){.key{transition:none}}
svg{display:block;width:100%;height:100%}
</style></head><body class="gleam-hud"><div id="hud"></div><script>
const root = document.getElementById('hud');
const escapeHtml = value => String(value).replace(/[&<>"']/g, char =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
function geometry(part) {
  return 'left:'+part.x+'px;top:'+part.y+'px;width:'+part.w+'px;height:'+part.h+'px;'
    +(part.radius ? 'border-radius:'+part.radius+'px;' : '');
}
window.paradox = {update(state) {
  const theme = document.documentElement;
  theme.toggleAttribute('data-light',!!state.light);
  theme.toggleAttribute('data-glass',!!state.glass);
  if (/^#[0-9a-f]{6}$/i.test(state.accent)) theme.style.setProperty('--accent',state.accent);
  else theme.style.removeProperty('--accent');
  if (state.parts.some(part => part.kind === 'key')) {
    if (root.children.length !== state.parts.length || !root.querySelector('.key')) {
      root.innerHTML = state.parts.map(part => '<div class="part '+part.kind+'" style="'+geometry(part)+'"'
        +(part.kind === 'key' && part.mouse ? ' data-counter' : part.kind === 'key' && part.h <= 10 ? ' data-bar' : '')+'>'
        +(part.kind === 'key' ? (part.mouse ? '<span class="mouse">'+escapeHtml(part.mouse)+'</span>' : '')
          +'<strong></strong>'+(part.mouse ? '<span class="key-unit">CPS</span>' : '') : '')+'</div>').join('');
    }
    for (let i = 0; i < state.parts.length; ++i) {
      const part = state.parts[i], key = root.children[i], label = key.querySelector('strong');
      if (!label) continue;
      key.toggleAttribute('data-pressed',part.pressed);
      key.toggleAttribute('data-long-label',part.text.length > 3);
      if (label.textContent !== part.text) label.textContent = part.text;
    }
    return;
  }
  root.innerHTML = state.parts.map(part => {
    let style = geometry(part);
    let content = '';
    if (part.kind === 'label') {
      const align = part.align === 'center' ? 'center' : part.align === 'right' ? 'flex-end' : 'flex-start';
      style += 'color:'+part.color+';font-size:'+part.size+'px;font-weight:'+(part.bold?700:400)+';justify-content:'+align+';';
      content = escapeHtml(part.text);
    } else if (part.kind === 'icon') {
      style += 'color:'+part.color+';';
      const paint = part.fill ? 'fill="currentColor"' :
        'fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"';
      content = '<svg viewBox="0 0 20 20" '+paint+'><path d="'+escapeHtml(part.path)+'"/></svg>';
    } else if (part.kind === 'box') {
      style += 'background:'+part.color+';';
      if (part.border) style += 'border:1px solid '+part.border+';';
    }
    return '<div class="part '+part.kind+'" style="'+style+'">'+content+'</div>';
  }).join('');
}};
</script></body></html>
