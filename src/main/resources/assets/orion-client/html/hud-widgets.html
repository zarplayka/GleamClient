<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" data-hud-theme href="hud-theme.css"><style>
html,body{margin:0;padding:0;background:transparent;color:var(--text)}
#hud{position:absolute;left:0;top:0}
.part{position:absolute;box-sizing:border-box}
.label{display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.panel{background:var(--hud-panel)}
.well{background:var(--well);border:1px solid var(--line)}
.divider{background:var(--line)}
.key{display:flex;align-items:center;justify-content:center;padding:0 2px;border:1px solid var(--line);background:var(--hud-panel);color:var(--text);line-height:1;transition:background-color .1s,border-color .1s,color .1s}
.key>strong,.key .mouse{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:7px;font-weight:700}
.key[data-long-label]>strong{font-size:6.25px}
.key[data-pressed]{border-color:var(--accent);background:var(--hud-selected);color:var(--accent)}
.key[data-space]>strong{display:block;width:55%;height:1px;background:currentColor;border-radius:1px}
.key[data-counter]:not([data-counting])>strong{display:none}
.key[data-counting]{flex-direction:column;gap:1px;font-variant-numeric:tabular-nums}
.key[data-counting]>.mouse,.key[data-counting]>strong{font-size:5.5px}
.timer{display:flex;align-items:center;justify-content:center;gap:2px;padding:0 1px;overflow:hidden;border-radius:3px;background:var(--accent);color:#17181f;font-size:5.8px;font-weight:700;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.timer>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.timer>i{box-sizing:border-box;width:4px;height:4px;border:1px solid currentColor;border-radius:50%;flex:none}
html[data-light] .timer{color:#f5f5f8}
.timer[data-expiring],html[data-light] .timer[data-expiring]{background:#f2a2a6;color:#17181f}
@media(prefers-reduced-motion:reduce){.key{transition:none}}
html[data-gleam-hud] .panel{border:1px solid var(--line)}
html[data-gleam-hud] .key{border-radius:3px!important}
html[data-gleam-hud] .key[data-pressed]{color:var(--text)}
html[data-gleam-hud]:not([data-light]) .timer:not([data-expiring]){background:var(--hud-selected);color:var(--accent);font-size:6.4px}
html[data-gleam-hud] .timer>i{width:3px;height:3px}
.key .mouse svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.7}
svg{display:block;width:100%;height:100%}
</style></head><body class="gleam-hud"><div id="hud"></div><script>
const root = document.getElementById('hud');
const escapeHtml = value => String(value).replace(/[&<>"']/g, char =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
function geometry(part) {
  return 'left:'+part.x+'px;top:'+part.y+'px;width:'+part.w+'px;height:'+part.h+'px;'
    +(part.radius ? 'border-radius:'+part.radius+'px;' : '');
}
window.paradox = {update(state) {
  const theme = document.documentElement;
  theme.toggleAttribute('data-light',!!state.light);
  theme.toggleAttribute('data-gleam-hud',!!state.gleamHud);
  if (/^#[0-9a-f]{6}$/i.test(state.accent)) theme.style.setProperty('--accent',state.accent);
  else theme.style.removeProperty('--accent');
  if (state.parts.some(part => part.kind === 'key')) {
    if (root.children.length !== state.parts.length || !root.querySelector('.key')) {
      root.innerHTML = state.parts.map(part => '<div class="part '+part.kind+'" style="'+geometry(part)+'"'
        +(part.kind === 'key' && part.mouse ? ' data-counter' : '')+'>'
        +(part.kind === 'key' ? (part.mouse ? '<span class="mouse" aria-label="'+(part.mouse === 'R' ? 'RMB' : 'LMB')+'"><svg viewBox="0 0 20 20"><path d="M6 6a4 4 0 0 1 8 0v7a4 4 0 0 1-8 0zm0 3h8m-4-7v7"/><path d="'+(part.mouse === 'R' ? 'M12 5v2' : 'M8 5v2')+'"/></svg></span>' : '')
          +'<strong></strong>' : '')+'</div>').join('');
    }
    for (let i = 0; i < state.parts.length; ++i) {
      const part = state.parts[i], key = root.children[i], label = key.querySelector('strong');
      if (!label) continue;
      key.toggleAttribute('data-pressed',part.pressed);
      key.toggleAttribute('data-long-label',part.text.length > 3);
      key.toggleAttribute('data-space',!part.text && !part.mouse);
      key.toggleAttribute('data-counting',!!part.mouse && !!part.text);
      if (label.textContent !== part.text) label.textContent = part.text;
    }
    return;
  }
  root.innerHTML = state.parts.map(part => {
    let style = geometry(part);
    let content = '';
    if (part.kind === 'timer') {
      return '<div class="part timer" style="'+style+'"'+(part.expiring ? ' data-expiring' : '')+'><span>'+escapeHtml(part.text)+'</span><i aria-hidden="true"></i></div>';
    }
    if (part.kind === 'label') {
      const align = part.align === 'center' ? 'center' : part.align === 'right' ? 'flex-end' : 'flex-start';
      style += 'color:'+part.color+';font-size:'+part.size+'px;font-weight:'+(part.bold?700:400)+';justify-content:'+align+';';
      content = escapeHtml(part.text);
    } else if (part.kind === 'icon') {
      style += 'color:'+part.color+';';
      const paint = part.fill ? 'fill="currentColor"' :
        'fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"';
      content = '<svg viewBox="0 0 20 20" '+paint+'><path d="'+escapeHtml(part.path)+'"/></svg>';
    } else if (part.kind === 'box') {
      style += 'background:'+part.color+';';
      if (part.border) style += 'border:1px solid '+part.border+';';
    }
    return '<div class="part '+part.kind+'" style="'+style+'">'+content+'</div>';
  }).join('');
}};
</script></body></html>
