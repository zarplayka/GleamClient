<!doctype html>
<html lang="ru" data-gleam-hud>
<head>
<meta charset="utf-8">
<link rel="stylesheet" data-hud-theme href="hud-theme.css">
<style>
* { box-sizing: border-box; }
body { width: 392px; height: 420px; margin: 0; overflow: hidden; color: var(--text); font-size: 14px; }
[hidden] { display: none !important; }
#stage { position: absolute; width: 392px; height: 420px; transform-origin: 196px 196px; }
#ring { position: absolute; inset: 0; width: 392px; height: 392px; }
.sector { fill: #10191ce8; stroke: #b7d5c625; stroke-width: .7; transition: fill .18s, stroke .18s; }
.sector.active { fill: #2e7158ee; stroke: #abdcc897; stroke-width: 1; }
html[data-light] .sector { fill: #e7eef0ed; stroke: #40545c45; }
html[data-light] .sector.active { fill: #8cbfa8; stroke: #34795d; }
#slots { position: absolute; inset: 0; }
.slot {
    position: absolute; width: 84px; height: 63px; margin: -31px 0 0 -42px;
    text-align: center; color: var(--text);
}
.slot { display: flex; align-items: center; justify-content: center; }
.slot.active .emote-mark { opacity: 1; transform: translateY(-2px) scale(1.13); }
.slot.empty .emote-mark { opacity: .38; }
.emote-mark { display: block; width: 47px; height: 51px; opacity: .77;
    transition: transform .2s cubic-bezier(.2,.8,.25,1), opacity .17s; }
.digit { position:absolute; right:6px; top:5px; min-width:15px; border-radius:4px;
    background:var(--hud-panel); color:var(--text); font-size:9px; line-height:15px; }
#hub {
    position: absolute; top: 133px; left: 133px; width: 126px; height: 126px;
    border: 1px solid var(--line); border-radius: 50%; background: var(--top);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    text-align: center; padding: 5px;
}
#hub-symbol { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-bottom: 3px; }
#title { display: flex; min-height: 16px; max-width: 104px; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; line-height: 13px; }
#subtitle { color: var(--muted); font-size: 8px; line-height: 9px; }
#arc { position: absolute; inset:0; width:126px; height:126px; pointer-events:none; transform-origin:63px 63px;
    transition: transform .23s cubic-bezier(.2,.75,.22,1), opacity .18s; }
.control, .option {
    position: absolute; height: 28px; text-align: center; line-height: 26px;
    background: var(--top); color: var(--text); border: 1px solid var(--line); border-radius: var(--hud-radius);
    padding: 0 4px; font-size: 12px; white-space: nowrap;
}
.control.active, .option.active { border-color: var(--accent); background: var(--hud-selected); }
#edit { left: 117px; top: 354px; width: 158px; }
#done { left: 216px; top: 354px; width: 132px; }
#reset { left: 44px; top: 354px; width: 132px; color: var(--muted); }
#hint { position: absolute; top: 393px; width: 392px; text-align: center; color: #f5f5f8; font-size: 11px; }
#picker {
    position: absolute; left: 50px; top: 66px; width: 292px; height: 288px;
    border: 1px solid var(--line); border-radius: var(--hud-radius); background: var(--hud-panel);
    text-align: center;
}
#picker-title { margin: 18px 0 0; font-size: 15px; line-height: 20px; font-weight: bold; }
#options { position: absolute; left: 0; top: 0; width: 290px; height: 232px; }
#options .option { width: 126px; height: 30px; line-height: 28px; overflow: hidden; text-overflow: ellipsis; }
#clear { left: 15px; top: 243px; width: 126px; }
#back { left: 149px; top: 243px; width: 126px; }
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="gleam-hud">
<div id="stage">
    <div id="wheel">
        <svg id="ring" viewBox="0 0 392 392" aria-hidden="true"></svg>
        <div id="slots"></div>
        <div id="hub"><div id="hub-symbol"></div><div id="title"></div><div id="subtitle"></div>
            <svg id="arc" viewBox="0 0 126 126" aria-hidden="true"><path d="M47 7a58 58 0 0 1 32 0" fill="none" stroke="#90d5bb" stroke-width="2.4" stroke-linecap="round"/></svg>
        </div>
        <div id="edit" class="control"></div>
        <div id="reset" class="control" hidden></div>
        <div id="done" class="control" hidden></div>
        <div id="hint"></div>
    </div>
    <div id="picker" hidden>
        <div id="picker-title"></div>
        <div id="options"></div>
        <div id="clear" class="control"></div>
        <div id="back" class="control"></div>
    </div>
</div>
<script>
const byId = id => document.getElementById(id);
const stage = byId('stage');
const slots = [];
const options = [];
const svg = 'http://www.w3.org/2000/svg';
const points = (r, a) => [196 + r * Math.sin(a), 196 - r * Math.cos(a)].join(' ');
const poses = [[0,0,0,0,0,0],[-13,108,-43,-26,24,8],[6,25,-105,-6,9,-10],
    [5,64,-68,12,-13,4],[-14,94,-110,-25,19,11],[10,-28,67,-32,23,-6],
    [-8,112,-61,-19,9,16],[13,50,-35,27,-25,-7],[-7,18,-116,-17,24,9],[7,62,-78,9,-10,-11]];
function mark(id) {
    if (!id) return '<svg class="emote-mark" viewBox="0 0 48 52"><path d="M24 19v14m-7-7h14" fill="none" stroke="#c4ddd1" stroke-width="2"/></svg>';
    const [lean,left,right,leftLeg,rightLeg,head] = poses[id] || poses[0];
    const block = (x,y,w,h,angle,px,py,face) =>
        '<g transform="rotate('+angle+' '+px+' '+py+')"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx=".5" fill="'+face+'"/>'
        +'<path d="M'+(x+w)+' '+y+'l2-1v'+h+'l-2 1z" fill="#728389"/><path d="M'+x+' '+y+'l2-1h'+w+'l-2 1z" fill="#f3f7f5"/></g>';
    return '<svg class="emote-mark" viewBox="0 0 48 52" aria-hidden="true"><g transform="rotate('+lean+' 24 27)">'
        +block(17,30,6,16,leftLeg,20,31,'#afc0bf')+block(24,30,6,16,rightLeg,27,31,'#cad7d4')
        +block(13,17,5,15,left,16,18,'#c7d4d1')+block(29,17,5,15,right,31,18,'#e1e9e6')
        +block(18,16,12,16,0,24,24,'#d7e3de')+block(18,5,12,11,head,24,15,'#edf4ef')+'</g></svg>';
}
for (let i = 0; i < 6; i++) {
    const slot = document.createElement('div');
    const digit = document.createElement('span');
    const emblem = document.createElement('span');
    const segment = document.createElementNS(svg,'path');
    const start = (60 * i - 30) * Math.PI / 180, end = (60 * i + 30) * Math.PI / 180;
    segment.setAttribute('class','sector');
    segment.setAttribute('d','M' + points(145,start) + ' A145 145 0 0 1 ' + points(145,end)
      + ' L' + points(74,end) + ' A74 74 0 0 0 ' + points(74,start) + ' Z');
    byId('ring').appendChild(segment);
    digit.className = 'digit';
    digit.textContent = String(i + 1);
    slot.appendChild(digit);
    slot.appendChild(emblem);
    byId('slots').appendChild(slot);
    slots.push({slot, digit, emblem, segment});

}

function updateOptions(names, selected, hovered) {
    for (let id = 1; id < names.length; id++) {
        let option = options[id - 1];
        if (!option) {
            option = document.createElement('div');
            option.style.left = 15 + (id - 1) % 2 * 134 + 'px';
            option.style.top = 50 + Math.floor((id - 1) / 2) * 36 + 'px';
            byId('options').appendChild(option);
            options.push(option);
        }
        option.textContent = id + '  ' + names[id];
        option.className = 'option' + (id === selected || id === hovered ? ' active' : '');
    }
}

let lastSector = 0, arcRotation = 0;
window.paradox = {
    update(state) {
        const root = document.documentElement;
        root.toggleAttribute('data-light', Boolean(state.light));
        if (/^#[0-9a-f]{6}$/i.test(state.accent)) root.style.setProperty('--accent', state.accent);
        else root.style.removeProperty('--accent');
        const labels = state.labels;
        const picking = state.slotToEdit >= 0;
        byId('wheel').hidden = picking;
        byId('picker').hidden = !picking;
        byId('edit').hidden = state.editing;
        byId('reset').hidden = byId('done').hidden = !state.editing;
        byId('hint').hidden = state.editing;
        const hovered = state.active >= 0 ? state.slots[state.active].id : 0;
        byId('title').textContent = hovered ? state.names[hovered] : labels[0];
        byId('subtitle').textContent = state.editing ? labels[5] : hovered ? '' : labels[1];
        const arc = byId('arc');
        arc.style.opacity = state.active >= 0 ? '1' : '0';
        if (state.active >= 0) {
            arcRotation += (((state.active - lastSector + 9) % 6) - 3) * 60;
            lastSector = state.active;
            arc.style.transform = 'rotate('+arcRotation+'deg)';
        }
        byId('edit').textContent = labels[2];
        byId('done').textContent = labels[3];
        byId('reset').textContent = labels[4];
        byId('hint').textContent = labels[9];
        byId('picker-title').textContent = labels[6] + (picking ? ' · ' + (state.slotToEdit + 1) : '');
        byId('clear').textContent = labels[7];
        byId('back').textContent = labels[8];
        for (let i = 0; i < slots.length; i++) {
            const {x, y, id} = state.slots[i];
            const {slot, digit, emblem, segment} = slots[i];
            segment.setAttribute('class','sector' + (i === state.active ? ' active' : ''));
            slot.className = 'slot' + (i === state.active ? ' active' : '') + (!id ? ' empty' : '');
            slot.style.left = x + 'px';
            slot.style.top = y + 'px';
            digit.hidden = !state.editing;
            if (emblem.dataset.id !== String(id)) {
                emblem.innerHTML = mark(id);
                emblem.dataset.id = String(id);
            }
        }
        for (const control of ['edit', 'done', 'reset', 'clear', 'back']) {
            byId(control).className = 'control' + (state.control === control ? ' active' : '');
        }
        if (picking) updateOptions(state.names, state.slots[state.slotToEdit].id, state.option);
    },
    opening(progress) {
        const eased = 1 - (1 - progress) ** 3;
        stage.style.setProperty('opacity', String(eased));
        stage.style.setProperty('transform', 'scale(' + (.92 + .08 * eased) + ')');
    }
};
</script>
</body>
</html>
